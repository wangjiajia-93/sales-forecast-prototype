*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}body{background:#f0f2f5;color:#2b2f36;font-size:13px}.top{height:56px;background:#173763;color:#fff;display:flex;align-items:center;padding:0 24px;box-shadow:0 2px 8px rgba(0,0,0,.12)}.logo{font-size:17px;font-weight:700}.user{margin-left:auto;color:#dbe6f7;font-size:12px}.layout{display:flex;height:calc(100vh - 56px)}.side{width:250px;background:#fff;border-right:1px solid #e5e8ef;padding:10px 0;overflow:auto}.m1{padding:12px 20px;font-weight:700;color:#173763;background:#f7faff}.m2{padding:10px 18px 10px 38px;cursor:pointer;color:#4c5665;border-left:3px solid transparent}.m2:hover{background:#f4f7fb;color:#173763}.m2.on{background:#e8f1ff;color:#173763;border-left-color:#2f6edb;font-weight:700}.main{flex:1;padding:16px;overflow:auto}.crumb{color:#7a8596;font-size:12px;margin-bottom:12px}.crumb b{color:#173763}.card{background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(20,35,60,.06);padding:14px;margin-bottom:12px}.tabs{display:flex;border-bottom:1px solid #e8edf5;margin-bottom:12px}.tab{padding:10px 16px;cursor:pointer;color:#667085;border-bottom:2px solid transparent}.tab.on{color:#173763;border-bottom-color:#2f6edb;font-weight:700}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar label{color:#667085;font-size:12px}.bar input,.bar select{height:30px;border:1px solid #d9dee8;border-radius:4px;padding:0 8px;background:#fff;min-width:110px}.btn{height:30px;padding:0 13px;border-radius:4px;border:1px solid #2f6edb;background:#2f6edb;color:#fff;cursor:pointer}.btn.ghost{background:#fff;color:#2f6edb}.btn.danger{background:#d92d20;border-color:#d92d20}.btn.gray,.btn:disabled{background:#f2f4f7;border-color:#d0d5dd;color:#98a2b3;cursor:not-allowed}.hint{font-size:12px;color:#7a8596;margin-top:8px}.tablebox{background:#fff;border-radius:6px;overflow:auto;box-shadow:0 1px 3px rgba(20,35,60,.06);max-height:calc(  {ver:'V-Z01-202608-001',doc:'HF-240801',apNo:'AP-FX-001',src:'历史销售预测',dt:'风险备货',qtyB:120,qtyA:150,inDate:'2026-04-10',dlvDate:'2026-04-25',opt:'标准',cfg:'标配/256GB/白色',note:'历史预测比例折算',price:2800,amt:420000,ship:'海运计收',type:'储备型',pFrom:'上海港',pTo:'新加坡港',trans:'海运',trade:'CIF',custCode:'C10023',custName:'上海电子科技',crt:'2026-08-01 09:00',crtBy:'张三',apTime:'—',modBy:'张三',mod:'2026-08-01 10:00',status:'草稿',...baseRows[0]},

 {ver:'V-Z03-202608-001',doc:'CD-240803',apNo:'—',src:'确定性需求',dt:'新品上市需求提报',qtyB:80,qtyA:130,inDate:'2026-06-08',dlvDate:'2026-06-20',opt:'标准',cfg:'标配/白色',note:'新品上市铺货',price:2800,amt:364000,ship:'海运计收',type:'订单型',pFrom:'深圳港',pTo:'新加坡港',trans:'海运',trade:'CIF',custCode:'C10091',custName:'广州供应链',crt:'2026-08-02 16:30',crtBy:'王五',apTime:'—',modBy:'王五',mod:'2026-08-02 16:30',status:'已驳回',...baseRows[2]},

function tag(s){return `<span class="tag ${statusCls[s]||'graytag'}">${s}</span>`}function qty(i,j){let b=60+i*25+j*6,a=b+(j%3+1)*12;return [b,a]}function monthSub(){return months.map(m=>`<th>${m}<br><span style="font-weight:400;color:#98a2b3">前/后</span></th>`).join('')}function monthCells(row,click){return months.map((m,j)=>{let q=qty(row.pCode.charCodeAt(1)||1,j);let inner=`${q[0]} / <b>${q[1]}</b>`;return `<td>${click?`<span class="num" onclick="openCountryQty('${row.cCode}','${row.pCode}','${m}')">${inner}</span>`:inner}</td>`}).join('')}function pager(total){return `<div class="card" style="margin-top:10px"><div class="bar" style="justify-content:flex-end"><label>每页显示</label><select><option>10</option><option>20</option><option>50</option><option>100</option></select><span>总记录数：${total}</span><span>当前页码：1</span><button class="btn ghost">上一页</button><button class="btn ghost">下一页</button></div></div>`}
function setPage(p){document.querySelectorAll('.m2').forEach(x=>x.classList.toggle('on',x.dataset.page===p)); if(p==='summary')summary(); else if(p==='ratio')ratioPage(); else if(p==='exception')exceptionPage(); else placeholder(p)}
document.querySelectorAll('.m2').forEach(x=>x.onclick=()=>setPage(x.dataset.page));
function filters(extra=''){return `<div class="card bar"><label>事业部</label><select><option>全部</option><option>电子事业部</option><option>通信事业部</option></select><label>大区</label><select><option>全部</option><option>华东大区</option><option>华南大区</option></select><label>国区</label><select><option>全部</option><option>沪苏国区</option><option>粤泰国区</option></select><label>月份</label><select>${months.map(x=>`<option>${x}</option>`).join('')}</select><button class="btn">查询</button><button class="btn ghost">重置</button>${extra}</div>`}
function qSelect(label,opts){return `<div class="field"><label>${label}</label><select multiple size="1" title="支持按编码/名称模糊查询和精准查询，支持单选/多选"><option value="">全部</option>${opts.map(o=>`<option>${o}</option>`).join('')}</select></div>`}
function summaryFilters(type){let area=['A01 华东大区','A02 华南大区','A03 华北大区'],prod=['P1001 智能终端A1','P2001 数据模块B2','P3001 控制模组C3'],zone=['Z01 沪苏国区','Z02 浙闽国区','Z03 粤泰国区','Z04 京津冀国区'],country=['CN 中国','JP 日本','SG 新加坡','TH 泰国'],war=['W01 华东作战区','W02 苏南作战区','W03 珠三角作战区','W04 华北作战区'],bu=['BU01 电子事业部','BU02 通信事业部'];let fields=[];if(type==='area')fields=[qSelect('大区编码/大区名称',area),qSelect('产品编码/产品名称',prod)];if(type==='zone')fields=[qSelect('大区编码/大区名称',area),qSelect('产品编码/产品名称',prod),qSelect('国区编码/国区名称',zone)];if(type==='country')fields=[qSelect('国家编码/国家名称',country),qSelect('大区编码/大区名称',area),qSelect('产品编码/产品名称',prod),qSelect('国区编码/国区名称',zone),qSelect('作战区域编码/作战区域名称',war)];if(type==='detail')fields=[`<div class="field"><label>数据来源</label><select id="srcFilter" multiple size="1" onchange="updateDemandTypeOptions()"><option>例外需求</option><option>历史销售预测</option><option>确定性需求</option><option>先行指标预测</option></select></div>`,`<div class="field"><label>需求类型</label><select id="typeFilter" multiple size="1"><option>风险备货</option><option>MTS备货</option><option>退市产品需求提交</option><option>新品上市需求提交</option><option>其他类型</option><option>历史销售预测</option><option>商机</option><option>线索</option><option>订单</option><option>合同</option><option>先行指标预测</option></select></div>`,qSelect('国家编码/国家名称',country),qSelect('大区编码/大区名称',area),qSelect('产品编码/产品名称',prod),qSelect('国区编码/国区名称',zone),qSelect('作战区域编码/作战区域名称',war),qSelect('事业部编码/事业部名称',bu),`<div class="field"><label>创建时间起</label><input type="datetime-local"></div>`,`<div class="field"><label>创建时间止</label><input type="datetime-local"></div>`];return `<div class="card"><div style="display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:12px;align-items:end">${fields.join('')}<div class="field"><label>&nbsp;</label><button class="btn" onclick="summaryQuery('${type}')">查询</button><button class="btn ghost" style="margin-left:8px" onclick="summaryReset('${type}')">重置</button></div></div><div class="hint">下拉条件支持按编码/名称模糊查询和精准查询，支持单选/多选；查询时已填条件之间为 AND 关系。</div></div>`}
function summaryQuery(type){alert('已按当前填写条件组合查询，已填条件之间为 AND 关系。')}
function summaryReset(type){document.querySelectorAll('#sumBody select').forEach(s=>[...s.options].forEach(o=>o.selected=false));document.querySelectorAll('#sumBody input').forEach(i=>i.value='');alert('已清空查询条件，并自动重新查询全量数据，分页重置为第1页。')}
function updateDemandTypeOptions(){let map={'例外需求':['风险备货','MTS备货','退市产品需求提交','新品上市需求提交','其他类型'],'历史销售预测':['历史销售预测'],'确定性需求':['商机','线索','订单','合同'],'先行指标预测':['先行指标预测']};let src=[...document.getElementById('srcFilter').selectedOptions].map(o=>o.value);let list=src.length?[...new Set(src.flatMap(s=>map[s]||[]))]:Object.values(map).flat();document.getElementById('typeFilter').innerHTML=list.map(x=>`<option>${x}</option>`).join('')}
function summary(){app.innerHTML=`<div class="crumb">销售预测 / <b>销售预测3+9需求汇总</b></div><div class="tabs"><div class="tab on" data-tab="area">大区维度汇总表</div><div class="tab" data-tab="zone">国区维度汇总表</div><div class="tab" data-tab="country">国家维度汇总表</div><div class="tab" data-tab="detail">明细表</div></div><div id="sumBody"></div>`;document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>sumTab(t.dataset.tab));sumTab('area')}
function sumTab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===t));let b=document.getElementById('sumBody');if(t==='area')b.innerHTML=summaryFilters('area')+areaTable();if(t==='zone')b.innerHTML=summaryFilters('zone')+zoneTable();if(t==='country')b.innerHTML=summaryFilters('country')+countryTable();if(t==='detail')b.innerHTML=summaryFilters('detail')+detailToolbar()+detailTable()}

function zoneTable(){return `<div class="hint">汇总维度：按国区 + 月份 + 产品编码汇总所有单据号。</div><div class="bar" style="justify-content:flex-end;margin:8px 0"><button class="btn ghost" onclick="exportFile('销售预测3+9需求汇总_国区维度','国区维度汇总表字段与列表一致')">导出</button></div><div class="tablebox"><table><thead><tr><th>国区编码</th><th>国区名称</th><th>机型</th><th>产品编码</th><th>产品名称</th><th colspan="13" class="monthHead">月度预测生效需求数量（修改前 / 修改后）</th><th>大区编码</th><th>大区名称</th><th>事业部名称</th><th>事业部编码</th><th style="position:sticky;right:0;background:#f8fafc;z-index:4">操作</th></tr><tr><th colspan="5"></th>${monthSub()}<th colspan="5"></th></tr></thead><tbody>${baseRows.map(r=>`<tr><td>${r.zoneCode}</td><td>${r.zoneName}</td><td>${r.model}</td><td>${r.pCode}</td><td>${r.pName}</td>${monthCells(r,false)}<td>${r.areaCode}</td><td>${r.areaName}</td><td>${r.bu}</td><td>${r.buCode}</td><td class="op" style="position:sticky;right:0;background:#fff;z-index:3"><a onclick="sumTab('country')">查看详情</a></td></tr>`).join('')}</tbody></table></div>${pager(baseRows.length)}`}

function openBppApproval(i){let d=detailRows[i];openModal('BPP审批详情页',`<h4 style="color:#173763;margin-bottom:8px">BPP审批信息</h4><div class="formgrid">${[['审批单号',d.apNo],['单据号',d.doc],['版本号',d.ver],['国区编码',d.zoneCode],['国区名称',d.zoneName],['作战区域编码',d.warCode],['作战区域名称',d.warName],['大区编码',d.areaCode],['大区名称',d.areaName],['国家编码',d.cCode],['国家名称',d.cName],['申请人账号','zhangsan'],['申请人姓名','张三'],['申请时间',d.crt],['一级审批人账号','leader01'],['二级审批人账号','manager02'],['三级审批人账号','director03'],['其它附件（可选）','客户邮件.pdf']].map(a=>`<div class="field"><label>${a[0]}</label><input value="${a[1]}" disabled></div>`).join('')}</div><h4 style="color:#173763;margin:14px 0 8px">销售预测3+9需求明细附件</h4>${attachmentTable([d])}<h4 style="color:#173763;margin:14px 0 8px">审批意见</h4><textarea id="bppOpinion" style="width:100%;height:72px;border:1px solid #d0d5dd;border-radius:4px;padding:8px" placeholder="请填写审批意见"></textarea><div style="margin-top:10px"><label><input type="radio" name="bppDecision" value="pass"> 通过</label><label style="margin-left:20px"><input type="radio" name="bppDecision" value="reject"> 驳回</label><label style="margin-left:20px"><input id="finalNode" type="checkbox" checked> 当前为最后审批节点</label></div>`,`<button class="btn" onclick="submitBpp(${i})">提交</button><button class="btn ghost" onclick="closeModal()">取消</button>`)}
function submitBpp(i){let op=document.getElementById('bppOpinion').value.trim(),dec=document.querySelector('input[name="bppDecision"]:checked');if(!op){alert('请填写审批意见！');return}if(!dec){alert('请选择审批选项！');return}detailRows[i].status=dec.value==='reject'?'已驳回':(document.getElementById('finalNode').checked?'已通过':'审批中');detailRows[i].apTime=new Date().toLocaleString();closeModal();sumTab('detail');alert('审批提交成功，列表审批状态已刷新。')}
function selectedDetailIndexes(){return [...document.querySelectorAll('.detailChk:checked')].map(c=>+c.dataset.i)}

function launchApproval(str){if(!document.getElementById('applyReason').value.trim()){alert('未填写申请理由！');return}if(!document.getElementById('ap1').selectedOptions.length){alert('未选择一级审批人！');return}str.split(',').map(Number).forEach((i,n)=>{detailRows[i].status='审批中';detailRows[i].apNo='AP-BPP-'+String(Date.now()).slice(-4)+'-'+(n+1)});closeModal();sumTab('detail');alert('已发起审批，所选数据状态已更新为审批中，并同步生成BPP审批单号。')}

function publishVer(){openModal('发布版本确认',`<p style="font-size:15px;margin:10px 0">确认发布新的需求计划么？</p><p class="hint">发布版本以国区维度发布：同一个国区维度的3+9需求数据生成1个版本；不同国区生成不同版本号，并与销售预测、例外需求、历史销售预测保持一致。发布成功的初始审批状态为草稿。</p>`,`<button class="btn" onclick="doPublish()">是</button><button class="btn ghost" onclick="closeModal()">取消</button>`)}function doPublish(){detailRows.forEach(d=>{d.ver='V-'+d.zoneCode+'-'+new Date().getFullYear()+'08-NEW';d.status='草稿'});closeModal();sumTab('detail');alert('发布成功，已按国区生成新版本号，初始审批状态为草稿。')}

${r.areaCode||''}" disabled></div><div class="field"><label>大区名称</label><input id="areaName${idx}" value="${r.areaName||''}" disabled></div><div class="field"><label>国区编码</label><input id="zoneCode${idx}" value="${r.zoneCode||''}" disabled></div><div class="field"><label>国区名称</label><input id="zoneName${idx}" value="${r.zoneName||''}" disabled></div></div><h4 style="color:#173763;margin:14px 0 8px">预测月份计算比例维护</h4><table><thead><tr>${['M','M1','M2','M3','M4~M6','M7~M12'].map(m=>`<th>${m}</th>`).join('')}</tr></thead><tbody><tr>${['M','M1','M2','M3','M4~M6','M7~M12'].map((m,k)=>`<td><input id="rate${idx}_${k}" value="${r.rate[k]}" ${ro?'disabled':''} style="width:62px;height:28px;border:1px solid #d0d5dd;border-radius:4px;padding:0 6px"> %</td>`).join('')}</tr></tbody></table></div>`}function fillOrg(idx){let c=document.getElementById('cCode'+idx)?.value, w=document.getElementById('warCode'+idx)?.value;let map={CN:{cName:'中国',areaCode:'A01',areaName:'华东大区',zoneCode:'Z01',zoneName:'沪苏国区'},SG:{cName:'新加坡',areaCode:'A02',areaName:'华南大区',zoneCode:'Z03',zoneName:'粤泰国区'}};let war={W01:'华东作战区',W03:'珠三角作战区'};if(document.getElementById('warName'+idx))document.getElementById('warName'+idx).value=war[w]||'';if(map[c])['cName','areaCode','areaName','zoneCode','zoneName'].forEach(k=>document.getElementById(k+idx).value=map[c][k])}function addRatioBlock(){let n=document.querySelectorAll('.ratioBlock').length;document.getElementById('ratioBlocks').insertAdjacentHTML('beforeend',ratioBlock({warCode:'',warName:'',zoneCode:'',zoneName:'',areaCode:'',areaName:'',cCode:'',cName:'',rate:[20,18,16,14,12,10]},false,n))}function removeRatioBlock(btn){let bs=document.querySelectorAll('.ratioBlock');if(bs.length<=1){alert('至少保留一组组织配置和计算比例维护。');return}btn.closest('.ratioBlock').remove()}function saveRatio(mode,i){let idx=0,war=document.getElementById('warCode0').value,c=document.getElementById('cCode0').value;if(!war||!c){alert('作战区域/国家/计算比例是必填字段，请填写！');return}let rates=[0,1,2,3,4,5].map(k=>+do function openExceptionBppApproval(i){let d=exceptionRows[i];openModal('BPP审批详情页',`<h4 style="color:#173763;margin-bottom:8px">BPP审批信息</h4><div class="formgrid">${[['审批单号',d.apNo],['单据号',d.doc],['版本号',d.ver],['需求类型',d.dt],['国区编码',d.zoneCode],['国区名称',d.zoneName],['作战区域编码',d.warCode],['作战区域名称',d.warName],['大区编码',d.areaCode],['大区名称',d.areaName],['国家编码',d.cCode],['国家名称',d.cName],['申请人账号','zhangsan'],['申请人姓名','张三'],['申请时间',d.crt],['一级审批人账号','leader01'],['二级审批人账号','manager02'],['三级审批人账号','director03']].map(a=>`<div class="field"><label>${a[0]}</label><input value="${a[1]}" disabled></div>`).join('')}</div><h4 style="color:#173763;margin:14px 0 8px">销售预测3+9需求明细附件</h4><div class="tablebox" style="max-height:220px"><table><thead><tr>${['单据号','审批单据号','需求类型','国家编码','国家名称','产品编码','产品名称','生效需求数量（修改前）','生效需求数量（修改后）','预计入库日期','版本号','审批状态'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody><tr><td>${d.doc}</td><td>${d.apNo}</td><td>${d.dt}</td><td>${d.cCode}</td><td>${d.cName}</td><td>${d.pCode}</td><td>${d.pName}</td><td>${d.qtyB}</td><td>${d.qtyA}</td><td>${d.inDate}</td><td>${d.ver}</td><td>${tag(d.status)}</td></tr></tbody></table></div><h4 style="color:#173763;margin:14px 0 8px">审批意见</h4><textarea id="exBppOpinion" style="width:100%;height:72px;border:1px solid #d0d5dd;border-radius:4px;padding:8px" placeholder="请填写审批意见"></textarea><div style="margin-top:10px"><label><input type="radio" name="exBppDecision" value="pass"> 通过</label><label style="margin-left:20px"><input type="radio" name="exBppDecision" value="reject"> 驳回</label><label style="margin-left:20px"><input id="exFinalNode" type="checkbox" checked> 当前为最后审批节点</label></div>`,`<button class="btn" onclick="submitExceptionBpp(${i})">提交</button><button class="btn ghost" onclick="closeModal()">取消</button>`)}
function submitExceptionBpp(i){let op=document.getElementById('exBppOpinion').value.trim(),dec=document.querySelector('input[name="exBppDecision"]:checked');if(!op){alert('请填写审批意见！');return}if(!dec){alert('请选择审批选项！');return}exceptionRows[i].status=dec.value==='reject'?'已驳回':(document.getElementById('exFinalNode').checked?'已通过':'审批中');exceptionRows[i].apTime=new Date().toLocaleString();closeModal();exTab('det');alert('BPP审批提交成功，对应明细行审批状态已刷新。')}
function openExceptionSubmitApproval(){let idxs=selectedExceptionIndexes();if(!idxs.length){alert('请选择数据！');return}let rows=idxs.map(i=>exceptionRows[i]);openModal('提交审批页面',`<div class="tablebox" style="max-height:260px"><table><thead><tr>${['单据号','需求类型','国家编码','国家名称','产品编码','产品名称','版本号','审批状态'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(d=>`<tr><td>${d.doc}</td><td>${d.dt}</td><td>${d.cCode}</td><td>${d.cName}</td><td>${d.pCode}</td><td>${d.pName}</td><td>${d.ver}</td><td>${tag(d.status)}</td></tr>`).join('')}</tbody></table></div>${pager(rows.length)}<div class="formgrid" style="margin-top:12px"><div class="field" style="grid-column:span 4"><label class="req">申请理由</label><textarea id="exApplyReason" style="width:100%;height:70px;border:1px solid #d0d5dd;border-radius:4px;padding:8px"></textarea></div><div class="field"><label class="req">一级审批人</label><select id="exAp1" multiple size="1"><option>leader01 张经理</option><option>leader02 李经理</option><option>leader03 周经理</option></select></div><div class="field"><label>二级审批人</label><select id="exAp2" multiple size="1"><option>manager01 王总监</option><option>manager02 赵总监</option><option>manager03 孙总监</option></select></div><div class="field"><label>三级审批人</label><select id="exAp3" multiple size="1"><option>director01 刘总</option><option>director02 陈总</option><option>director03 黄总</option></select></div><div class="field"><label>添加附件</label><input type="file" multiple accept="image/*,.xls,.xlsx,.doc,.docx,.pdf"></div></div><p class="hint">每页显示条数支持 10/20/50/100；审批人下拉支持多选；附件支持图片、Excel、Word、PDF 等文件。</p>`,`<button class="btn" onclick="launchExceptionApproval('${idxs.join(',')}')">发起审批</button><button class="btn ghost" onclick="closeModal()">取消</button>`)}
function launchExceptionApproval(str){if(!document.getElementById('exApplyReason').value.trim()){alert('未填写申请理由！');return}if(!document.getElementById('exAp1').selectedOptions.length){alert('未选择一级审批人！');return}str.split(',').map(Number).forEach((i,n)=>{exceptionRows[i].status='审批中';exceptionRows[i].apNo='AP-BPP-EX-'+String(Date.now()).slice(-4)+'-'+(n+1)});closeModal();exTab('det');alert('已发起审批，自动生成BPP审批单号，所选数据状态已更新为审批中。')}
function openExceptionAdd(){let doc='EX-'+String(Date.now()).slice(-6);openModal('新增例外需求',`<h4 style="color:#173763;margin-bottom:8px">基本信息</h4><div class="formgrid"><div class="field"><label>单据号</label><input id="exNewDoc" value="${doc}" disabled></div><div class="field"><label class="req">需求类型</label><select id="exNewType"><option value="">请选择</option><option>风险备货</option><option>MTS备货</option><option>退市需求提报</option><option>新品上市需求提报</option><option>其他类型</option></select></div><div class="field"><label class="req">作战区域编码</label><select id="exNewWar" onchange="fillExceptionOrg()"><option value="">请选择</option><option value="W01">W01</option><option value="W03">W03</option><option value="W04">W04</option></select></div><div class="field"><label>作战区域名称</label><input id="exNewWarName" disabled></div><div class="field"><label class="req">国家编码</label><select id="exNewCountry" onchange="fillExceptionOrg();refreshExceptionPorts()"><option value="">请选择</option><option value="CN">CN</option><option value="SG">SG</option><option value="TH">TH</option><option value="JP">JP</option></select></div><div class="field"><label>国家名称</label><input id="exNewCountryName" disabled></div><div class="field"><label>国区编码</label><input id="exNewZoneCode" disabled></div><div class="field"><label>国区名称</label><input id="exNewZoneName" disabled></div><div class="field"><label>大区编码</label><input id="exNewAreaCode" disabled></div><div class="field"><label>大区名称</label><input id="exNewAreaName" disabled></div></div><h4 style="color:#173763;margin:14px 0 8px">产品信息</h4><div class="tablebox" style="max-height:330px"><table><thead><tr>${['产品编码','产品名称','机型','选配','配置说明','需求备注','需求数量','预计入库日期','要求交货日期','发运计收','订单型/储备型','港口/起运港','港口/目的港','运输方式','贸易术语','客户编码','客户名称','单价','总金额','事业部编码','事业部名称'].map(x=>`<th>${x}</th>`).join('')}<th style="position:sticky;right:0;background:#f8fafc;z-index:4">操作</th></tr></thead><tbody id="exProductBody">${exceptionProductRow(0)}</tbody></table></div><button class="btn ghost exAddRowBtn" onclick="addExceptionProductRow()">添加产品行</button><p class="hint">产品编码输入后自动带出产品名称、单价、事业部；需求数量必须为大于0的整数；预计入库日期必须大于等于当前日期；港口跟国家编码联动。</p>`,`<button class="btn" onclick="saveExceptionAdd()">保存</button><button class="btn ghost" onclick="closeModal()">取消</button>`);fillExceptionOrg();refreshExceptionPorts()}
function exceptionProductRow(i){let today=new Date().toISOString().slice(0,10);return `<tr class="exProdRow"><td><input class="exPCode" oninput="fillExceptionProduct(this)" placeholder="必填" style="width:110px"></td><td><input class="exPName" disabled style="width:130px"></td><td><input class="exModel" style="width:90px"></td><td><input class="exOpt" style="width:90px"></td><td><input class="exCfg" style="width:120px"></td><td><input class="exNote" style="width:120px"></td><td><input class="exQty" type="number" min="1" oninput="calcExceptionAmount(this)" style="width:80px"></td><td><input class="exInDate" type="date" min="${today}" style="width:130px"></td><td><input class="exDlvDate" type="date" style="width:130px"></td><td><select class="exShip"><option value="">请选择</option><option>是</option><option>否</option></select></td><td><select class="exOrderType"><option value="">请选择</option><option>订单型</option><option>储备型</option></select></td><td><select class="exPortFrom"><option value="">请选择</option></select></td><td><select class="exPortTo"><option value="">请选择</option></select></td><td><select class="exTrans"><option value="">请选择</option><option>海运</option><option>陆运</option></select></td><td><select class="exTrade"><option value="">请选择</option>${['暂无','内贸','CFR','CIF','CIP','DAF','DAP','DDP','EXW','FCA','FOB','UN'].map(x=>`<option>${x}</option>`).join('')}</select></td><td><select class="exCustCode"><option value="">请选择</option><option>C1001</option><option>C2002</option><option>C3003</option></select></td><td><select class="exCustName"><option value="">请选择</option><option>华东客户</option><option>东南亚客户</option><option>欧洲客户</option></select></td><td><input class="exPrice" disabled style="width:80px"></td><td><input class="exAmt" disabled style="width:100px"></td><td><input class="exBuCode" disabled style="width:90px"></td><td><input class="exBuName" disabled style="width:110px"></td><td class="op" style="position:sticky;right:0;background:#fff;z-index:3"><a onclick="copyExceptionProduct(this)">复制</a><a onclick="deleteExceptionProduct(this)">删除</a></td></tr>`}
function fillExceptionOrg(){let war={W01:'华东作战区',W03:'珠三角作战区',W04:'华北作战区'},map={CN:['中国','Z01','沪苏国区','A01','华东大区'],SG:['新加坡','Z03','粤泰国区','A02','华南大区'],TH:['泰国','Z03','粤泰国区','A02','华南大区'],JP:['日本','Z04','日韩国区','A03','东北亚大区']};let w=document.getElementById('exNewWar')?.value,c=document.getElementById('exNewCountry')?.value,m=map[c]||['','','','',''];if(document.getElementById('exNewWarName'))exNewWarName.value=war[w]||'';['exNewCountryName','exNewZoneCode','exNewZoneName','exNewAreaCode','exNewAreaName'].forEach((id,i)=>document.getElementById(id).value=m[i]||'')}
function refreshExceptionPorts(){let c=document.getElementById('exNewCountry')?.value,ports={CN:['上海港','宁波港','深圳港'],SG:['新加坡港'],TH:['曼谷港','林查班港'],JP:['东京港','大阪港']},opts=(ports[c]||[]).map(x=>`<option>${x}</option>`).join('');document.querySelectorAll('.exPortFrom,.exPortTo').forEach(s=>s.innerHTML='<option value="">请选择</option>'+opts)}
function fillExceptionProduct(inp){let p={P1001:['智能终端A1',1200,'BU01','电子事业部'],P2001:['数据模块B2',860,'BU02','通信事业部'],P3001:['控制模组C3',1450,'BU01','电子事业部']},r=inp.closest('tr'),v=p[inp.value.trim()]||['',0,'',''];r.querySelector('.exPName').value=v[0];r.querySelector('.exPrice').value=v[1]||'';r.querySelector('.exBuCode').value=v[2];r.querySelector('.exBuName').value=v[3];calcExceptionAmount(inp)}
function calcExceptionAmount(el){let r=el.closest('tr'),q=+r.querySelector('.exQty').value,p=+r.querySelector('.exPrice').value;r.querySelector('.exAmt').value=q>0&&p>0?q*p:''}
function copyExceptionProduct(a){let old=a.closest('tr'),html=exceptionProductRow(document.querySelectorAll('.exProdRow').length);old.insertAdjacentHTML('afterend',html);let n=old.nextElementSibling;['exPCode','exModel','exOpt','exCfg','exNote','exQty','exInDate','exDlvDate','exShip','exOrderType','exTrans','exTrade','exCustCode','exCustName'].forEach(c=>{let v=old.querySelector('.'+c)?.value;if(n.querySelector('.'+c))n.querySelector('.'+c).value=v});refreshExceptionPorts();['exPortFrom','exPortTo'].forEach(c=>{let v=old.querySelector('.'+c)?.value;if(n.querySelector('.'+c))n.querySelector('.'+c).value=v});fillExceptionProduct(n.querySelector('.exPCode'))}
function deleteExceptionProduct(a){if(document.querySelectorAll('.exProdRow').length<=1){alert('至少保留一行产品信息！');return}a.closest('tr').remove()}
function addExceptionProductRow(){document.getElementById('exProductBody').insertAdjacentHTML('beforeend',exceptionProductRow(document.querySelectorAll('.exProdRow').length));refreshExceptionPorts()}
function setExceptionFormData(d,ro=false,basicOnly=false){exNewDoc.value=d.doc;exNewType.value=d.dt;exNewWar.value=d.warCode;exNewCountry.value=d.cCode;fillExceptionOrg();refreshExceptionPorts();let r=document.querySelector('.exProdRow');r.querySelector('.exPCode').value=d.pCode;r.querySelector('.exPName').value=d.pName;r.querySelector('.exModel').value=d.model;r.querySelector('.exOpt').value=d.opt;r.querySelector('.exCfg').value=d.cfg;r.querySelector('.exNote').value=d.note;r.querySelector('.exQty').value=d.qtyA;r.querySelector('.exInDate').value=d.inDate;r.querySelector('.exDlvDate').value=d.dlvDate;r.querySelector('.exShip').value=d.ship;r.querySelector('.exOrderType').value=d.type;r.querySelector('.exTrans').value=d.trans;r.querySelector('.exTrade').value=d.trade;r.querySelector('.exCustCode').value=d.custCode;r.querySelector('.exCustName').value=d.custName;r.querySelector('.exPrice').value=d.price;r.querySelector('.exAmt').value=d.amt;r.querySelector('.exBuCode').value=d.buCode;r.querySelector('.exBuName').value=d.bu;['exPortFrom','exPortTo'].forEach((c,k)=>{let v=k?d.pTo:d.pFrom;if(r.querySelector('.'+c))r.querySelector('.'+c).value=v});['exNewDoc','exNewType','exNewWar','exNewCountry'].forEach(id=>document.getElementById(id).disabled=true);if(ro){document.querySelectorAll('#modalBody input,#modalBody select, #modalBody textarea').forEach(x=>x.disabled=true);document.querySelectorAll('#modalBody .op').forEach(x=>x.innerHTML='—');document.querySelectorAll('#modalBody .exAddRowBtn').forEach(x=>x.style.display='none')}}
function editException(i){let d=exceptionRows[i];openExceptionAdd();modalTitle.innerHTML='编辑例外需求';modalFoot.innerHTML=`<button class="btn" onclick="saveExceptionEdit(${i})">保存</button><button class="btn ghost" onclick="closeModal()">取消</button>`;setExceptionFormData(d,false,true)}
function saveExceptionEdit(i){saveExceptionAdd();exceptionRows.splice(i+1,1);alert('编辑保存成功，基本信息保持不可编辑，产品信息已更新。')}
function viewOnly(i){let d=exceptionRows[i];openExceptionAdd();modalTitle.innerHTML='例外需求查看详情';modalFoot.innerHTML='<button class="btn ghost" onclick="closeModal()">关闭</button>';setExceptionFormData(d,true,false)}
function saveExceptionAdd(){let doc=exNewDoc.value,dt=exNewType.value,war=exNewWar.value,c=exNewCountry.value;if(!dt){alert('需求类型必填！');return}if(!war){alert('作战区域编码必填！');return}if(!c){alert('国家编码必填！');return}let today=new Date().toISOString().slice(0,10),rows=[...document.querySelectorAll('.exProdRow')];for(let r of rows){let code=r.querySelector('.exPCode').value.trim(),qty=+r.querySelector('.exQty').value,inDate=r.querySelector('.exInDate').value;if(!code){alert('产品编码必填！');return}if(!Number.isInteger(qty)||qty<=0){alert('需求数量必须为大于0的整数！');return}if(!inDate||inDate<today){alert('预计入库日期必须大于等于当前日期！');return}for(let c of ['exShip','exOrderType','exPortFrom','exPortTo','exTrans','exTrade']){if(!r.querySelector('.'+c).value){alert('产品信息中存在必填项未填写！');return}}}
rows.forEach((r,i)=>exceptionRows.unshift({doc:doc+(rows.length>1?'-'+(i+1):''),apNo:'—',dt,src:'例外需求',status:'草稿',ver:'V-EX-'+new Date().getFullYear()+'08-NEW',warCode:war,warName:exNewWarName.value,cCode:c,cName:exNewCountryName.value,zoneCode:exNewZoneCode.value,zoneName:exNewZoneName.value,areaCode:exNewAreaCode.value,areaName:exNewAreaName.value,bu:r.querySelector('.exBuName').value,buCode:r.querySelector('.exBuCode').value,model:r.querySelector('.exModel').value,pCode:r.querySelector('.exPCode').value,pName:r.querySelector('.exPName').value,opt:r.querySelector('.exOpt').value,cfg:r.querySelector('.exCfg').value,note:r.querySelector('.exNote').value,qtyB:0,qtyA:+r.querySelector('.exQty').value,inDate:r.querySelector('.exInDate').value,dlvDate:r.querySelector('.exDlvDate').value,price:+r.querySelector('.exPrice').value||0,amt:+r.querySelector('.exAmt').value||0,ship:r.querySelector('.exShip').value,type:r.querySelector('.exOrderType').value,pFrom:r.querySelector('.exPortFrom').value,pTo:r.querySelector('.exPortTo').value,trans:r.querySelector('.exTrans').value,trade:r.querySelector('.exTrade').value,custCode:r.querySelector('.exCustCode').value,custName:r.querySelector('.exCustName').value,crt:new Date().toLocaleString(),crtBy:'张三',modBy:'—',mod:'—',apTime:'—'}));closeModal();exTab('det');alert('新增成功，数据已进入草稿状态。')}
function exceptionAction(a){const msg={撤回:'仅审批中可撤回，按审批单据号撤回。',废弃:'仅已驳回、已撤回可废弃，按审批单据号废弃。',删除:'仅草稿、已废弃且自己新增/导入的数据可删除。'};if(a==='新增'){openExceptionAdd();return}if(a==='编辑'){let idxs=selectedExceptionIndexes();if(!idxs.length){alert('请选择需要编辑的数据！');return}editException(idxs[0]);return}if(a==='提交审批'){openExceptionSubmitApproval();return}if(a==='导入'){openModal('导入例外需求',`<div class="field"><label class="req">选择导入文件</label><input type="file" accept=".xls,.xlsx"></div><p class="hint">请选择 Excel 文件上传，系统将按模板格式解析并校验。</p>`,`<button class="btn" onclick="closeModal();alert('导入文件已选择，进入导入解析流程。')">确定</button><button class="btn ghost" onclick="closeModal()">取消</button>`);return}if(a==='下载导入模版'){alert('下载导入模版成功！');return}alert(msg[a]||'操作成功')}
function placeholder(p){const name={history:'历史销售预测',certain:'确定性需求'}[p]||p;app.innerHTML=`<div class="crumb">销售预测 / <b>${name}</b></div><div class="card"><h3 style="color:#173763;margin-bottom:8px">${name}</h3><p>该菜单用于承载${name}业务页面，本次需求重点已在3+9需求汇总、例外需求、历史销售预测计算比例维护中实现。</p></div>`}
function openModal(title,body,foot){modalTitle.innerHTML=title;modalBody.innerHTML=body;modalFoot.innerHTML=foot||'<button class="btn ghost" onclick="closeModal()">关闭</button>';modalMask.style.display='flex';document.getElementById('modal').classList.toggle('small',title.includes('确认'))}function closeModal(){modalMask.style.display='none'}function exportFile(name,desc){let now=new Date(),pad=n=>String(n).padStart(2,'0');let fmt=name.includes('比例')?`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}：${pad(now.getMinutes())}：${pad(now.getSeconds())}`:`${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;let file=`${name}_${fmt}.xlsx`;alert(`导出成功：${file}\n${desc}\n系统按当前查询条件导出全部匹配数据，不受分页限制，并按登录账号角色数据权限导出。`)}
setPage('summary');
