*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}body{background:#f0f2f5;color:#2b2f36;font-size:13px}.top{height:56px;background:#173763;color:#fff;display:flex;align-items:center;padding:0 24px;box-shadow:0 2px 8px rgba(0,0,0,.12)}.logo{font-size:17px;font-weight:700}.user{margin-left:auto;color:#dbe6f7;font-size:12px}.layout{display:flex;height:calc(100vh - 56px)}.side{width:250px;background:#fff;border-right:1px solid #e5e8ef;padding:10px 0;overflow:auto}.m1{padding:12px 20px;font-weight:700;color:#173763;background:#f7faff}.m2{padding:10px 18px 10px 38px;cursor:pointer;color:#4c5665;border-left:3px solid transparent}.m2:hover{background:#f4f7fb;color:#173763}.m2.on{background:#e8f1ff;color:#173763;border-left-color:#2f6edb;font-weight:700}.main{flex:1;padding:16px;overflow:auto}.crumb{color:#7a8596;font-size:12px;margin-bottom:12px}.crumb b{color:#173763}.card{background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(20,35,60,.06);padding:14px;margin-bottom:12px}.tabs{display:flex;border-bottom:1px solid #e8edf5;margin-bottom:12px}.tab{padding:10px 16px;cursor:pointer;color:#667085;border-bottom:2px solid transparent}.tab.on{color:#173763;border-bottom-color:#2f6edb;font-weight:700}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar label{color:#667085;font-size:12px}.bar input,.bar select{height:30px;border:1px solid #d9dee8;border-radius:4px;padding:0 8px;background:#fff;min-width:110px}.btn{height:30px;padding:0 13px;border-radius:4px;border:1px solid #2f6edb;background:#2f6edb;color:#fff;cursor:pointer}.btn.ghost{background:#fff;color:#2f6edb}.btn.danger{background:#d92d20;border-color:#d92d20}.btn.gray,.btn:disabled{background:#f2f4f7;border-color:#d0d5dd;color:#98a2b3;cursor:not-allowed}.hint{font-size:12px;color:#7a8596;margin-top:8px}.tablebox{background:#fff;border-radius:6px;overflow:auto;box-shadow:0 1px 3px rgba(20,35,60,.06);max-height:calc( <body>
<div class="top"><div class="logo">销售预测系统</div><div class="user">登录账号：张三｜数据权限：华东/华南区域</div></div>
<div class="layout"><div class="side"><div class="m1">销售预测</div><div class="m2" data-page="history">历史销售预测</div><div class="m2" data-page="certain">确定性需求</div><div class="m2" data-page="exception">例外需求</div><div class="m2 on" data-page="summary">销售预测3+9需求汇总</div><div class="m2" data-page="ratio">历史销售预测计算比例维护</div></div><div class="main" id="app"></div></div><div class="footer">v3.0 高保真原型增强版</div>
<div class="modalMask" id="modalMask"><div class="modal" id="modal"><div class="modalHd"><span id="modalTitle"></span><span class="x" onclick="closeModal()">×</span></div><div class="modalBd" id="modalBody"></div><div class="modalFt" id="modalFoot"><button class="btn ghost" onclick="closeModal()">关闭</button></div></div></div>
<script>
const months=['M月','M1','M2','M3','M4','M5','M6','M7','M8','M9','M10','M11','M12'];

const statusCls={'草稿':'graytag','审批中':'blue','已驳回':'red','已撤回':'orange','已通过':'green','已废弃':'graytag'};
const baseRows=[
 {areaCode:'A01',areaName:'华东大区',zoneCode:'Z01',zoneName:'沪苏国区',warCode:'W01',warName:'华东作战区',cCode:'CN',cName:'中国',model:'A系列',pCode:'P1001',pName:'智能终端A1',bu:'电子事业部',buCode:'BU01'},

 {areaCode:'A02',areaName:'华南大区',zoneCode:'Z03',zoneName:'粤泰国区',warCode:'W03',warName:'珠三角作战区',cCode:'SG',cName:'新加坡',model:'A系列',pCode:'P1001',pName:'智能终端A1',bu:'通信事业部',buCode:'BU02'},
 {areaCode:'A03',areaName:'华北大区',zoneCode:'Z04',zoneName:'京津冀国区',warCode:'W04',warName:'华北作战区',cCode:'TH',cName:'泰国',model:'C系列',pCode:'P3001',pName:'控制模组C3',bu:'电子事业部',buCode:'BU01'}
];
let detailRows=[
 {ver:'V-Z01-202608-001',doc:'HF-240801',apNo:'AP-FX-001',src:'历史销售预测',dt:'风险备货',qtyB:120,qtyA:150,inDate:'2026-04-10',dlvDate:'2026-04-25',opt:'标准',cfg:'标配/256GB/白色',note:'历史预测比例折算',price:2800,amt:420000,ship:'海运计收',type:'储备型',pFrom:'上海港',pTo:'新加坡港',trans:'海运',trade:'CIF',custCode:'C10023',custName:'上海电子科技',crt:'2026-08-01 09:00',crtBy:'张三',apTime:'—',modBy:'张三',mod:'2026-08-01 10:00',status:'草稿',...baseRows[0]},
 {ver:'V-Z01-202608-001',doc:'EX-240802',apNo:'AP-QT-002',src:'例外需求',dt:'其他类型',qtyB:0,qtyA:90,inDate:'2026-05-12',dlvDate:'2026-05-28',opt:'高配',cfg:'512GB/黑色',note:'客户临时追加',price:3200,amt:288000,ship:'空运计收',type:'订单型',pFrom:'浦东机场',pTo:'东京',trans:'空运',trade:'FOB',custCode:'C10045',custName:'江苏智能设备',crt:'2026-08-01 11:20',crtBy:'李四',apTime:'—',modBy:'李四',mod:'2026-08-01 11:40',status:'审批中',...baseRows[1]},
 {ver:'V-Z03-202608-001',doc:'CD-240803',apNo:'—',src:'确定性需求',dt:'新品上市需求提报',qtyB:80,qtyA:130,inDate:'2026-06-08',dlvDate:'2026-06-20',opt:'标准',cfg:'标配/白色',note:'新品上市铺货',price:2800,amt:364000,ship:'海运计收',type:'订单型',pFrom:'深圳港',pTo:'新加坡港',trans:'海运',trade:'CIF',custCode:'C10091',custName:'广州供应链',crt:'2026-08-02 16:30',crtBy:'王五',apTime:'—',modBy:'王五',mod:'2026-08-02 16:30',status:'已驳回',...baseRows[2]},
 {ver:'V-Z04-202608-001',doc:'HF-240804',apNo:'AP-MTS-003',src:'历史销售预测',dt:'mts备货',qtyB:30,qtyA:60,inDate:'2026-07-20',dlvDate:'2026-08-05',opt:'标准',cfg:'标配/128GB',note:'MTS滚动预测',price:1800,amt:108000,ship:'陆运计收',type:'储备型',pFrom:'天津港',pTo:'—',trans:'陆运',trade:'—',custCode:'C10078',custName:'北京科技',crt:'2026-08-03 11:00',crtBy:'张三',apTime:'2026-08-03 15:00',modBy:'张三',mod:'2026-08-03 12:00',status:'已通过',...baseRows[3]}
];

let ratioRows=[
 {no:1,predType:'历史销售预测',warCode:'W01',warName:'华东作战区',zoneCode:'Z01',zoneName:'沪苏国区',areaCode:'A01',areaName:'华东大区',cCode:'CN',cName:'中国',rate:[20,18,16,14,12,10],crt:'2026-08-01 09:00',status:'停用'},
 {no:2,predType:'历史销售预测',warCode:'W03',warName:'珠三角作战区',zoneCode:'Z03',zoneName:'粤泰国区',areaCode:'A02',areaName:'华南大区',cCode:'SG',cName:'新加坡',rate:[25,20,18,15,12,10],crt:'2026-08-02 09:00',status:'启用'}
];
let exceptionRows=detailRows.filter(x=>x.src==='例外需求').concat([{...detailRows[2],src:'例外需求',doc:'EX-240805',status:'已撤回',apNo:'AP-FB-005',dt:'风险备货'}]);
function tag(s){return `<span class="tag ${statusCls[s]||'graytag'}">${s}</span>`}function qty(i,j){let b=60+i*25+j*6,a=b+(j%3+1)*12;return [b,a]}function monthSub(){return months.map(m=>`<th>${m}<br><span style="font-weight:400;color:#98a2b3">前/后</span></th>`).join('')}function monthCells(row,click){return months.map((m,j)=>{let q=qty(row.pCode.charCodeAt(1)||1,j);let inner=`${q[0]} / <b>${q[1]}</b>`;return `<td>${click?`<span class="num" onclick="openCountryQty('${row.cCode}','${row.pCode}','${m}')">${inner}</span>`:inner}</td>`}).join('')}function pager(total){return `<div class="card" style="margin-top:10px"><div class="bar" style="justify-content:flex-end"><label>每页显示</label><select><option>10</option><option>20</option><option>50</option><option>100</option></select><span>总记录数：${total}</span><span>当前页码：1</span><button class="btn ghost">上一页</button><button class="btn ghost">下一页</button></div></div>`}
function setPage(p){document.querySelectorAll('.m2').forEach(x=>x.classList.toggle('on',x.dataset.page===p)); if(p==='summary')summary(); else if(p==='ratio')ratioPage(); else if(p==='exception')exceptionPage(); else placeholder(p)}
document.querySelectorAll('.m2').forEach(x=>x.onclick=()=>setPage(x.dataset.page));
function filters(extra=''){return `<div class="card bar"><label>事业部</label><select><option>全部</option><option>电子事业部</option><option>通信事业部</option></select><label>大区</label><select><option>全部</option><option>华东大区</option><option>华南大区</option></select><label>国区</label><select><option>全部</option><option>沪苏国区</option><option>粤泰国区</option></select><label>月份</label><select>${months.map(x=>`<option>${x}</option>`).join('')}</select><button class="btn">查询</button><button class="btn ghost">重置</button>${extra}</div>`}
function qSelect(label,opts){return `<div class="field"><label>${label}</label><select multiple size="1" title="支持按编码/名称模糊查询和精准查询，支持单选/多选"><option value="">全部</option>${opts.map(o=>`<option>${o}</option>`).join('')}</select></div>`}
function summaryFilters(type){let area=['A01 华东大区','A02 华南大区','A03 华北大区'],prod=['P1001 智能终端A1','P2001 数据模块B2','P3001 控制模组C3'],zone=['Z01 沪苏国区','Z02 浙闽国区','Z03 粤泰国区','Z04 京津冀国区'],country=['CN 中国','JP 日本','SG 新加坡','TH 泰国'],war=['W01 华东作战区','W02 苏南作战区','W03 珠三角作战区','W04 华北作战区'],bu=['BU01 电子事业部','BU02 通信事业部'];let fields=[];if(type==='area')fields=[qSelect('大区编码/大区名称',area),qSelect('产品编码/产品名称',prod)];if(type==='zone')fields=[qSelect('大区编码/大区名称',area),qSelect('产品编码/产品名称',prod),qSelect('国区编码/国区名称',zone)];if(type==='country')fields=[qSelect('国家编码/国家名称',country),qSelect('大区编码/大区名称',area),qSelect('产品编码/产品名称',prod),qSelect('国区编码/国区名称',zone),qSelect('作战区域编码/作战区域名称',war)];if(type==='detail')fields=[`<div class="field"><label>数据来源</label><select id="srcFilter" multiple size="1" onchange="updateDemandTypeOptions()"><option>例外需求</option><option>历史销售预测</option><option>确定性需求</option><option>先行指标预测</option></select></div>`,`<div class="field"><label>需求类型</label><select id="typeFilter" multiple size="1"><option>风险备货</option><option>MTS备货</option><option>退市产品需求提交</option><option>新品上市需求提交</option><option>其他类型</option><option>历史销售预测</option><option>商机</option><option>线索</option><option>订单</option><option>合同</option><option>先行指标预测</option></select></div>`,qSelect('国家编码/国家名称',country),qSelect('大区编码/大区名称',area),qSelect('产品编码/产品名称',prod),qSelect('国区编码/国区名称',zone),qSelect('作战区域编码/作战区域名称',war),qSelect('事业部编码/事业部名称',bu),`<div class="field"><label>创建时间起</label><input type="datetime-local"></div>`,`<div class="field"><label>创建时间止</label><input type="datetime-local"></div>`];return `<div class="card"><div style="display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:12px;align-items:end">${fields.join('')}<div class="field"><label>&nbsp;</label><button class="btn" onclick="summaryQuery('${type}')">查询</button><button class="btn ghost" style="margin-left:8px" onclick="summaryReset('${type}')">重置</button></div></div><div class="hint">下拉条件支持按编码/名称模糊查询和精准查询，支持单选/多选；查询时已填条件之间为 AND 关系。</div></div>`}
function summaryQuery(type){alert('已按当前填写条件组合查询，已填条件之间为 AND 关系。')}
function summaryReset(type){document.querySelectorAll('#sumBody select').forEach(s=>[...s.options].forEach(o=>o.selected=false));document.querySelectorAll('#sumBody input').forEach(i=>i.value='');alert('已清空查询条件，并自动重新查询全量数据，分页重置为第1页。')}
function updateDemandTypeOptions(){let map={'例外需求':['风险备货','MTS备货','退市产品需求提交','新品上市需求提交','其他类型'],'历史销售预测':['历史销售预测'],'确定性需求':['商机','线索','订单','合同'],'先行指标预测':['先行指标预测']};let src=[...document.getElementById('srcFilter').selectedOptions].map(o=>o.value);let list=src.length?[...new Set(src.flatMap(s=>map[s]||[]))]:Object.values(map).flat();document.getElementById('typeFilter').innerHTML=list.map(x=>`<option>${x}</option>`).join('')}
function summary(){app.innerHTML=`<div class="crumb">销售预测 / <b>销售预测3+9需求汇总</b></div><div class="tabs"><div class="tab on" data-tab="area">大区维度汇总表</div><div class="tab" data-tab="zone">国区维度汇总表</div><div class="tab" data-tab="country">国家维度汇总表</div><div class="tab" data-tab="detail">明细表</div></div><div id="sumBody"></div>`;document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>sumTab(t.dataset.tab));sumTab('area')}
function sumTab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===t));let b=document.getElementById('sumBody');if(t==='area')b.innerHTML=summaryFilters('area')+areaTable();if(t==='zone')b.innerHTML=summaryFilters('zone')+zoneTable();if(t==='country')b.innerHTML=summaryFilters('country')+countryTable();if(t==='detail')b.innerHTML=summaryFilters('detail')+detailToolbar()+detailTable()}

function zoneTable(){return `<div class="hint">汇总维度：按国区 + 月份 + 产品编码汇总所有单据号。</div><div class="bar" style="justify-content:flex-end;margin:8px 0"><button class="btn ghost" onclick="exportFile('销售预测3+9需求汇总_国区维度','国区维度汇总表字段与列表一致')">导出</button></div><div class="tablebox"><table><thead><tr><th>国区编码</th><th>国区名称</th><th>机型</th><th>产品编码</th><th>产品名称</th><th colspan="13" class="monthHead">月度预测生效需求数量（修改前 / 修改后）</th><th>大区编码</th><th>大区名称</th><th>事业部名称</th><th>事业部编码</th><th style="position:sticky;right:0;background:#f8fafc;z-index:4">操作</th></tr><tr><th colspan="5"></th>${monthSub()}<th colspan="5"></th></tr></thead><tbody>${baseRows.map(r=>`<tr><td>${r.zoneCode}</td><td>${r.zoneName}</td><td>${r.model}</td><td>${r.pCode}</td><td>${r.pName}</td>${monthCells(r,false)}<td>${r.areaCode}</td><td>${r.areaName}</td><td>${r.bu}</td><td>${r.buCode}</td><td class="op" style="position:sticky;right:0;background:#fff;z-index:3"><a onclick="sumTab('country')">查看详情</a></td></tr>`).join('')}</tbody></table></div>${pager(baseRows.length)}`}

function openBppApproval(i){let d=detailRows[i];openModal('BPP审批详情页',`<h4 style="color:#173763;margin-bottom:8px">BPP审批信息</h4><div class="formgrid">${[['审批单号',d.apNo],['单据号',d.doc],['版本号',d.ver],['国区编码',d.zoneCode],['国区名称',d.zoneName],['作战区域编码',d.warCode],['作战区域名称',d.warName],['大区编码',d.areaCode],['大区名称',d.areaName],['国家编码',d.cCode],['国家名称',d.cName],['申请人账号','zhangsan'],['申请人姓名','张三'],['申请时间',d.crt],['一级审批人账号','leader01'],['二级审批人账号','manager02'],['三级审批人账号','director03'],['其它附件（可选）','客户邮件.pdf']].map(a=>`<div class="field"><label>${a[0]}</label><input value="${a[1]}" disabled></div>`).join('')}</div><h4 style="color:#173763;margin:14px 0 8px">销售预测3+9需求明细附件</h4>${attachmentTable([d])}<h4 style="color:#173763;margin:14px 0 8px">审批意见</h4><textarea id="bppOpinion" style="width:100%;height:72px;border:1px solid #d0d5dd;border-radius:4px;padding:8px" placeholder="请填写审批意见"></textarea><div style="margin-top:10px"><label><input type="radio" name="bppDecision" value="pass"> 通过</label><label style="margin-left:20px"><input type="radio" name="bppDecision" value="reject"> 驳回</label><label style="margin-left:20px"><input id="finalNode" type="checkbox" checked> 当前为最后审批节点</label></div>`,`<button class="btn" onclick="submitBpp(${i})">提交</button><button class="btn ghost" onclick="closeModal()">取消</button>`)}
function submitBpp(i){let op=document.getElementById('bppOpinion').value.trim(),dec=document.querySelector('input[name="bppDecision"]:checked');if(!op){alert('请填写审批意见！');return}if(!dec){alert('请选择审批选项！');return}detailRows[i].status=dec.value==='reject'?'已驳回':(document.getElementById('finalNode').checked?'已通过':'审批中');detailRows[i].apTime=new Date().toLocaleString();closeModal();sumTab('detail');alert('审批提交成功，列表审批状态已刷新。')}
function selectedDetailIndexes(){return [...document.querySelectorAll('.detailChk:checked')].map(c=>+c.dataset.i)}

function launchApproval(str){if(!document.getElementById('applyReason').value.trim()){alert('未填写申请理由！');return}if(!document.getElementById('ap1').selectedOptions.length){alert('未选择一级审批人！');return}str.split(',').map(Number).forEach((i,n)=>{detailRows[i].status='审批中';detailRows[i].apNo='AP-BPP-'+String(Date.now()).slice(-4)+'-'+(n+1)});closeModal();sumTab('detail');alert('已发起审批，所选数据状态已更新为审批中，并同步生成BPP审批单号。')}

function publishVer(){openModal('发布版本确认',`<p style="font-size:15px;margin:10px 0">确认发布新的需求计划么？</p><p class="hint">发布版本以国区维度发布：同一个国区维度的3+9需求数据生成1个版本；不同国区生成不同版本号，并与销售预测、例外需求、历史销售预测保持一致。发布成功的初始审批状态为草稿。</p>`,`<button class="btn" onclick="doPublish()">是</button><button class="btn ghost" onclick="closeModal()">取消</button>`)}function doPublish(){detailRows.forEach(d=>{d.ver='V-'+d.zoneCode+'-'+new Date().getFullYear()+'08-NEW';d.status='草稿'});closeModal();sumTab('detail');alert('发布成功，已按国区生成新版本号，初始审批状态为草稿。')}

function exceptionSubmitApprovalContent(rows,apNo){return '<h4 style="color:#173763;margin-bottom:8px">基本信息</h4><div class="formgrid"><div class="field"><label>需求类型</label><input value="'+(rows[0]?.dt||'')+'" disabled></div><div class="field"><label>审批单据号</label><input value="'+apNo+'" disabled></div><div class="field"><label>申请人账号</label><input value="zhangsan" disabled></div><div class="field"><label>申请人姓名</label><input value="张三" disabled></div></div><h4 style="color:#173763;margin:14px 0 8px">例外需求明细附件</h4>'+exceptionAttachmentTable(rows)+'<h4 style="color:#173763;margin:14px 0 8px">其他附件</h4><div class="field"><label>添加附件</label><input id="exFileInput" type="file" multiple accept="image/*,.xls,.xlsx,.doc,.docx,.pdf" onchange="handleExceptionFileUpload(this)"></div>'+exceptionAttachmentsTable()+'<h4 style="color:#173763;margin:14px 0 8px">申请理由</h4><div class="field"><label class="req">申请理由</label><textarea id="exApplyReason" style="width:100%;height:70px;border:1px solid #d0d5dd;border-radius:4px;padding:8px" placeholder="请填写申请理由"></textarea></div><h4 style="color:#173763;margin:14px 0 8px">审批人信息</h4><div class="formgrid"><div class="field"><label class="req">一级审批人</label><select id="exAp1" multiple size="1"><option>leader01 张经理</option><option>leader02 李经理</option><option>leader03 周经理</option></select><div class="hint">必选，支持多选</div></div><div class="field"><label>二级审批人</label><select id="exAp2" multiple size="1"><option>manager01 王总监</option><option>manager02 赵总监</option><option>manager03 孙总监</option></select><div class="hint">可选，支持多选</div></div><div class="field"><label>三级审批人</label><select id="exAp3" multiple size="1"><option>director01 刘总</option><option>director02 陈总</option><option>director03 黄总</option></select><div class="hint">可选，支持多选</div></div></div><p class="hint">附件支持图片、Excel、Word、PDF；单文件不超过30M，最多上传3个。</p>'}
function exceptionAttachmentTable(rows){return '<div class="tablebox" style="max-height:220px"><table><thead><tr>'+['单据号','行号','需求类型','产品编码','产品名称','国家编码','国家名称','审批状态','操作'].map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(d=>'<tr><td>'+d.doc+'</td><td>'+(exceptionRows.indexOf(d)+1)+'</td><td>'+d.dt+'</td><td>'+d.pCode+'</td><td>'+d.pName+'</td><td>'+d.cCode+'</td><td>'+d.cName+'</td><td>'+tag(d.status)+'</td><td class="op"><a onclick="alert(\'预览：'+d.doc+'\')">预览</a><a onclick="alert(\'下载：'+d.doc+'\')">下载</a></td></tr>').join('')+'</tbody></table></div>'}
function exceptionAttachmentsTable(){if(!exceptionAttachments.length)return'<p class="hint">暂无附件</p>';return'<div class="tablebox" style="max-height:150px"><table><thead><tr>'+['文件名称','文件路径','文件ID','上传时间','操作'].map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+exceptionAttachments.map((f,i)=>'<tr><td>'+f.fileName+'</td><td style="font-size:11px;color:#7a8596">'+f.filePath+'</td><td>'+f.fileId+'</td><td>'+f.uploadTime+'</td><td class="op"><a onclick="removeExceptionAttachment('+i+')">删除</a><a onclick="alert(\'下载：'+f.fileName+'\')">下载</a></td></tr>').join('')+'</tbody></table></div>'}
function handleExceptionFileUpload(inp){let files=[...inp.files];if(exceptionAttachments.length+files.length>3){alert('最多只能上传3个附件！');return}files.forEach(f=>{let id='FILE-'+String(Date.now()).slice(-6)+'-'+Math.random().toString(36).substr(2,5).toUpperCase();exceptionAttachments.push({fileName:f.name,filePath:'/uploads/'+f.name,fileId:id,uploadTime:new Date().toLocaleString()})});inp.value='';document.getElementById('modalBody').innerHTML=exceptionSubmitApprovalContent([...selectedExceptionIndexes().map(i=>exceptionRows[i])],document.getElementById('modalTitle').innerText.match(/AP-BPP[^+]*\+(.+)$/)?.[1]||'')}
function removeExceptionAttachment(i){exceptionAttachments.splice(i,1);document.getElementById('modalBody').innerHTML=exceptionSubmitApprovalContent([...selectedExceptionIndexes().map(i=>exceptionRows[i])],document.getElementById('modalTitle').innerText.match(/AP-BPP[^+]*\+(.+)$/)?.[1]||'')}
function launchExceptionApproval(str){if(!document.getElementById('exApplyReason').value.trim()){alert('未填写申请理由！');return}if(!document.getElementById('exAp1').selectedOptions.length){alert('未选择一级审批人！');return}str.split(',').map(Number).forEach((i,n)=>{exceptionRows[i].status='审批中';exceptionRows[i].apNo='AP-BPP-EX-'+String(Date.now()).slice(-4)+'-'+(n+1)});closeModal();exTab('det');alert('已发起审批，自动生成BPP审批单号。')}
function openExceptionBppApproval(i){let d=exceptionRows[i];openModal('BPP审批详情页（例外需求）','<h4 style="color:#173763;margin-bottom:8px">BPP审批信息</h4><div class="formgrid">'+[['审批单号',d.apNo],['单据号',d.doc],['需求类型',d.dt],['产品编码',d.pCode],['产品名称',d.pName],['国家编码',d.cCode],['国家名称',d.cName],['申请人账号','zhangsan'],['申请人姓名','张三'],['申请时间',d.crt],['一级审批人账号','leader01'],['二级审批人账号','manager02'],['三级审批人账号','director03']].map(a=>'<div class="field"><label>'+a[0]+'</label><input value="'+a[1]+'" disabled></div>').join('')+'</div><h4 style="color:#173763;margin:14px 0 8px">例外需求明细附件</h4>'+exceptionAttachmentTable([d])+'<h4 style="color:#173763;margin:14px 0 8px">审批意见</h4><textarea id="exBppOpinion" style="width:100%;height:72px;border:1px solid #d0d5dd;border-radius:4px;padding:8px" placeholder="请填写审批意见"></textarea><div style="margin-top:10px"><label><input type="radio" name="exBppDecision" value="pass"> 通过</label><label style="margin-left:20px"><input type="radio" name="exBppDecision" value="reject"> 驳回</label></div>','<button class="btn" onclick="submitExceptionBpp('+i+')">提交</button><button class="btn ghost" onclick="closeModal()">取消</button>')}
function submitExceptionBpp(i){let op=document.getElementById('exBppOpinion').value.trim(),dec=document.querySelector('input[name="exBppDecision"]:checked');if(!op){alert('请填写审批意见！');return}if(!dec){alert('请选择审批选项！');return}exceptionRows[i].status=dec.value==='reject'?'已驳回':'审批中';if(dec.value==='pass')exceptionRows[i].status='已通过';exceptionRows[i].apTime=new Date().toLocaleString();closeModal();exTab('det');alert('审批提交成功，列表审批状态已刷新。')}
function openExceptionEdit(i){let d=exceptionRows[i];openModal('编辑例外需求','<div class="formgrid"><div class="field"><label>单据号</label><input value="'+d.doc+'" disabled></div><div class="field"><label>需求类型</label><select id="exEditDt"><option'+(d.dt==='风险备货'?' selected':'')+'>风险备货</option><option'+(d.dt==='MTS备货'?' selected':'')+'>MTS备货</option><option'+(d.dt==='退市需求提报'?' selected':'')+'>退市需求提报</option><option'+(d.dt==='新品上市需求提报'?' selected':'')+'>新品上市需求提报</option><option'+(d.dt==='其他类型'?' selected':'')+'>其他类型</option></select></div><div class="field"><label>产品编码</label><input id="exEditPc" value="'+d.pCode+'"></div><div class="field"><label>产品名称</label><input id="exEditPn" value="'+d.pName+'"></div><div class="field"><label class="req">生效需求数量（修改后）</label><input id="exEditQty" value="'+d.qtyA+'"></div><div class="field"><label>预计入库日期</label><input id="exEditInDate" type="date" value="'+d.inDate+'"></div><div class="field"><label>国家编码</label><input id="exEditCc" value="'+d.cCode+'"></div><div class="field"><label>国家名称</label><input id="exEditCn" value="'+d.cName+'"></div></div><p class="hint">仅草稿、已驳回、已撤回状态可编辑；产品信息和数量为核心字段。</p>','<button class="btn" onclick="saveExceptionEdit('+i+')">保存</button><button class="btn ghost" onclick="closeModal()">取消</button>')}
function saveExceptionEdit(i){let v=+document.getElementById('exEditQty').value;if(!Number.isInteger(v)||v<=0){alert('请填写正整数需求数量！');return}exceptionRows[i].dt=document.getElementById('exEditDt').value;exceptionRows[i].pCode=document.getElementById('exEditPc').value;exceptionRows[i].pName=document.getElementById('exEditPn').value;exceptionRows[i].qtyA=v;exceptionRows[i].inDate=document.getElementById('exEditInDate').value;exceptionRows[i].cCode=document.getElementById('exEditCc').value;exceptionRows[i].cName=document.getElementById('exEditCn').value;exceptionRows[i].mod=new Date().toLocaleString();closeModal();exTab('det');alert('保存成功，列表已刷新。')}
function openExceptionViewDetail(i){let d=exceptionRows[i];openModal('例外需求查看详情（只读）','<div class="formgrid"><div class="field"><label>单据号</label><input value="'+d.doc+'" disabled></div><div class="field"><label>审批单据号</label><input value="'+d.apNo+'" disabled></div><div class="field"><label>需求类型</label><input value="'+d.dt+'" disabled></div><div class="field"><label>审批状态</label><input value="'+d.status+'" disabled></div><div class="field"><label>产品编码</label><input value="'+d.pCode+'" disabled></div><div class="field"><label>产品名称</label><input value="'+d.pName+'" disabled></div><div class="field"><label>国家编码</label><input value="'+d.cCode+'" disabled></div><div class="field"><label>国家名称</label><input value="'+d.cName+'" disabled></div><div class="field"><label>生效需求数量（修改前）</label><input value="'+d.qtyB+'" disabled></div><div class="field"><label>生效需求数量（修改后）</label><input value="'+d.qtyA+'" disabled></div><div class="field"><label>预计入库日期</label><input value="'+d.inDate+'" disabled></div><div class="field"><label>要求交货日期</label><input value="'+d.dlvDate+'" disabled></div><div class="field"><label>作战区域</label><input value="'+d.warCode+' '+d.warName+'" disabled></div><div class="field"><label>国区</label><input value="'+d.zoneCode+' '+d.zoneName+'" disabled></div><div class="field"><label>大区</label><input value="'+d.areaCode+' '+d.areaName+'" disabled></div><div class="field"><label>事业部</label><input value="'+d.bu+'('+d.buCode+')" disabled></div><div class="field"><label>创建时间</label><input value="'+d.crt+'" disabled></div><div class="field"><label>创建人</label><input value="'+d.crtBy+'" disabled></div></div><p class="hint">只读模式，只能查看和关闭页面，不能进行任何操作。</p>','<button class="btn ghost" onclick="closeModal()">关闭</button>')}
function openExceptionNew(){let newDoc='EX-'+String(Date.now()).slice(-6);openModal('新增例外需求','<div class="formgrid"><div class="field"><label>单据号</label><input value="'+newDoc+'" disabled></div><div class="field"><label class="req">需求类型</label><select id="exNewDt"><option>风险备货</option><option>MTS备货</option><option>退市需求提报</option><option>新品上市需求提报</option><option>其他类型</option></select></div><div class="field"><label class="req">产品编码</label><select id="exNewPc"><option value="P1001">P1001 智能终端A1</option><option value="P2001">P2001 数据模块B2</option><option value="P3001">P3001 控制模组C3</option></select></div><div class="field"><label class="req">产品名称</label><input id="exNewPn" value="智能终端A1"></div><div class="field"><label class="req">生效需求数量</label><input id="exNewQty" type="number" placeholder="请填写数量"></div><div class="field"><label class="req">预计入库日期</label><input id="exNewInDate" type="date"></div><div class="field"><label>国家编码</label><select id="exNewCc"><option value="CN">CN 中国</option><option value="JP">JP 日本</option><option value="SG">SG 新加坡</option><option value="TH">TH 泰国</option></select></div><div class="field"><label>国家名称</label><input id="exNewCn" value="中国"></div></div><p class="hint">例外单据号自动生成；产品信息至少一行；新增后状态为草稿。</p>','<button class="btn" onclick="saveExceptionNew()">保存</button><button class="btn ghost" onclick="closeModal()">取消</button>')}
function saveExceptionNew(){let qty=+document.getElementById('exNewQty').value;if(!Number.isInteger(qty)||qty<=0){alert('请填写正整数需求数量！');return}let pc=document.getElementById('exNewPc').value,pn=document.getElementById('exNewPn').value;let row={doc:document.getElementById('exNewInDate')?.closest('.formgrid').querySelector('[disabled]').value,apNo:'—',src:'例外需求',dt:document.getElementById('exNewDt').value,qtyB:0,qtyA:qty,inDate:document.getElementById('exNewInDate').value||'2026-08-10',dlvDate:'2026-08-25',opt:'标准',cfg:'标配',note:'新增例外需求',price:0,amt:0,ship:'—',type:'订单型',pFrom:'—',pTo:'—',trans:'—',trade:'—',custCode:'—',custName:'—',crt:new Date().toLocaleString(),crtBy:'张三',modBy:'—',mod:'—',ver:'—',apTime:'—',status:'草稿',pCode:pc,pName:pn,cCode:document.getElementById('exNewCc').value,cName:document.getElementById('exNewCn').value,...baseRows[0]};row.doc=document.querySelector('#modal .formgrid input[disabled]')?.value||row.doc;exceptionRows.unshift(row);closeModal();exTab('det');alert('新增成功，单据号：'+row.doc)}
function placeholder(p){const name={history:'历史销售预测',certain:'确定性需求'}[p]||p;app.innerHTML=`<div class="crumb">销售预测 / <b>${name}</b></div><div class="card"><h3 style="color:#173763;margin-bottom:8px">${name}</h3><p>该菜单用于承载${name}业务页面，本次需求重点已在3+9需求汇总、例外需求、历史销售预测计算比例维护中实现。</p></div>`}
function openModal(title,body,foot){modalTitle.innerHTML=title;modalBody.innerHTML=body;modalFoot.innerHTML=foot||'<button class="btn ghost" onclick="closeModal()">关闭</button>';modalMask.style.display='flex';document.getElementById('modal').classList.toggle('small',title.includes('确认'))}function closeModal(){modalMask.style.display='none'}function exportFile(name,desc){let now=new Date(),pad=n=>String(n).padStart(2,'0');let fmt=name.includes('比例')?`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}：${pad(now.getMinutes())}：${pad(now.getSeconds())}`:`${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;let file=`${name}_${fmt}.xlsx`;alert(`导出成功：${file}\n${desc}\n系统按当前查询条件导出全部匹配数据，不受分页限制，并按登录账号角色数据权限导出。`)}
setPage('summary');
