<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}body{background:#f0f2f5;color:#2b2f36;font-size:13px}.top{height:56px;background:#173763;color:#fff;display:flex;align-items:center;padding:0 24px;box-shadow:0 2px 8px rgba(0,0,0,.12)}.logo{font-size:17px;font-weight:700}.user{margin-left:auto;color:#dbe6f7;font-size:12px}.layout{display:flex;height:calc(100vh - 56px)}.side{width:250px;background:#fff;border-right:1px solid #e5e8ef;padding:10px 0;overflow:auto}.m1{padding:12px 20px;font-weight:700;color:#173763;background:#f7faff}.m2{padding:10px 18px 10px 38px;cursor:pointer;color:#4c5665;border-left:3px solid transparent}.m2:hover{background:#f4f7fb;color:#173763}.m2.on{background:#e8f1ff;color:#173763;border-left-color:#2f6edb;font-weight:700}.main{flex:1;padding:16px;overflow:auto}.crumb{color:#7a8596;font-size:12px;margin-bottom:12px}.crumb b{color:#173763}.card{background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(20,35,60,.06);padding:14px;margin-bottom:12px}.tabs{display:flex;border-bottom:1px solid #e8edf5;margin-bottom:12px}.tab{padding:10px 16px;cursor:pointer;color:#667085;border-bottom:2px solid transparent}.tab.on{color:#173763;border-bottom-color:#2f6edb;font-weight:700}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar label{color:#667085;font-size:12px}.bar input,.bar select{height:30px;border:1px solid #d9dee8;border-radius:4px;padding:0 8px;background:#fff;min-width:110px}.btn{height:30px;padding:0 13px;border-radius:4px;border:1px solid #2f6edb;background:#2f6edb;color:#fff;cursor:pointer}.btn.ghost{background:#fff;color:#2f6edb}.btn.danger{background:#d92d20;border-color:#d92d20}.btn.gray,.btn:disabled{background:#f2f4f7;border-color:#d0d5dd;color:#98a2b3;cursor:not-allowed}.hint{font-size:12px;color:#7a8596;margin-top:8px}.tablebox{background:#fff;border-radius:6px;overflow:auto;box-shadow:0 1px 3px rgba(20,35,60,.06);max-height:calc(100vh - 225px)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px solid #edf0f5;border-right:1px solid #f3f5f8;padding:8px 9px;white-space:nowrap;text-align:left}th{position:sticky;top:0;background:#f8fafc;color:#475467;font-weight:700;z-index:2}tr:hover td{background:#fbfdff}.monthHead{background:#e9f2ff!important;text-align:center!important;color:#173763!important}.num{color:#2f6edb;cursor:pointer;font-weight:700}.num:hover{text-decoration:underline}.op a{color:#2f6edb;margin-right:10px;cursor:pointer}.op a.disabled{color:#b8c0cc;cursor:not-allowed;text-decoration:none}.tag{padding:2px 7px;border-radius:10px;font-size:11px}.green{background:#e8f8ef;color:#138a4a}.blue{background:#e8f1ff;color:#1d5fd1}.red{background:#ffecec;color:#c42626}.orange{background:#fff4e5;color:#b86b00}.graytag{background:#eef0f4;color:#667085}.modalMask{display:none;position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:20;align-items:center;justify-content:center}.modal{background:#fff;border-radius:8px;width:86vw;max-width:1280px;max-height:84vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.22)}.modal.small{width:460px}.modalHd{padding:14px 18px;border-bottom:1px solid #eaecf0;font-weight:700;color:#173763;display:flex}.x{margin-left:auto;cursor:pointer;color:#98a2b3}.modalBd{padding:14px;overflow:auto}.modalFt{padding:12px 18px;border-top:1px solid #eaecf0;text-align:right}.formgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field label{display:block;color:#667085;margin-bottom:4px;font-size:12px}.field input,.field select{width:100%;height:32px;border:1px solid #d0d5dd;border-radius:4px;padding:0 8px}.req:before{content:'*';color:#d92d20;margin-right:2px}.footer{position:fixed;right:16px;bottom:8px;color:#a5adba;font-size:11px}
</style>

<body>
<div class="top"><div class="logo">销售预测系统</div><div class="user">登录账号：张三｜数据权限：华东/华南区域</div></div>
<div class="layout"><div class="side"><div class="m1">销售预测</div><div class="m2" data-page="history">历史销售预测</div><div class="m2" data-page="certain">确定性需求</div><div class="m2" data-page="exception">例外需求</div><div class="m2 on" data-page="summary">销售预测3+9需求汇总</div><div class="m2" data-page="ratio">历史销售预测计算比例维护</div></div><div class="main" id="app"></div></div><div class="footer">v3.0 高保真原型增强版</div>
<div class="modalMask" id="modalMask"><div class="modal" id="modal"><div class="modalHd"><span id="modalTitle"></span><span class="x" onclick="closeModal()">×</span></div><div class="modalBd" id="modalBody"></div><div class="modalFt" id="modalFoot"><button class="btn ghost" onclick="closeModal()">关闭</button></div></div></div>
<script>
const months=['M月','M1','M2','M3','M4','M5','M6','M7','M8','M9','M10','M11','M12'];
const statuses=['草稿','审批中','已驳回','已撤回','已通过','已废弃'];
const statusCls={'草稿':'graytag','审批中':'blue','已驳回':'red','已撤回':'orange','已通过':'green','已废弃':'graytag'};
const baseRows=[
 {areaCode:'A01',areaName:'华东大区',zoneCode:'Z01',zoneName:'沪苏国区',warCode:'W01',warName:'华东作战区',cCode:'CN',cName:'中国',model:'A系列',pCode:'P1001',pName:'智能终端A1',bu:'电子事业部',buCode:'BU01'},
 {areaCode:'A01',areaName:'华东大区',zoneCode:'Z02',zoneName:'浙闽国区',warCode:'W02',warName:'苏南作战区',cCode:'JP',cName:'日本',model:'B系列',pCode:'P2001',pName:'数据模块B2',bu:'电子事业部',buCode:'BU01'},
 {areaCode:'A02',areaName:'华南大区',zoneCode:'Z03',zoneName:'粤泰国区',warCode:'W03',warName:'珠三角作战区',cCode:'SG',cName:'新加坡',model:'A系列',pCode:'P1001',pName:'智能终端A1',bu:'通信事业部',buCode:'BU02'},
 {areaCode:'A03',areaName:'华北大区',zoneCode:'Z04',zoneName:'京津冀国区',warCode:'W04',warName:'华北作战区',cCode:'TH',cName:'泰国',model:'C系列',pCode:'P3001',pName:'控制模组C3',bu:'电子事业部',buCode:'BU01'}
];
let detailRows=[
 {ver:'V-Z01-202608-001',doc:'HF-240801',apNo:'AP-FX-001',src:'历史销售预测',dt:'风险备货',qtyB:120,qtyA:150,inDate:'2026-04-10',dlvDate:'2026-04-25',opt:'标准',cfg:'标配/256GB/白色',note:'历史预测比例折算',price:2800,amt:420000,ship:'海运计收',type:'储备型',pFrom:'上海港',pTo:'新加坡港',trans:'海运',trade:'CIF',custCode:'C10023',custName:'上海电子科技',crt:'2026-08-01 09:00',crtBy:'张三',apTime:'—',modBy:'张三',mod:'2026-08-01 10:00',status:'草稿',...baseRows[0]},
 {ver:'V-Z01-202608-001',doc:'EX-240802',apNo:'AP-QT-002',src:'例外需求',dt:'其他类型',qtyB:0,qtyA:90,inDate:'2026-05-12',dlvDate:'2026-05-28',opt:'高配',cfg:'512GB/黑色',note:'客户临时追加',price:3200,amt:288000,ship:'空运计收',type:'订单型',pFrom:'浦东机场',pTo:'东京',trans:'空运',trade:'FOB',custCode:'C10045',custName:'江苏智能设备',crt:'2026-08-01 11:20',crtBy:'李四',apTime:'—',modBy:'李四',mod:'2026-08-01 11:40',status:'审批中',...baseRows[1]},
 {ver:'V-Z03-202608-001',doc:'CD-240803',apNo:'—',src:'确定性需求',dt:'新品上市需求提报',qtyB:80,qtyA:130,inDate:'2026-06-08',dlvDate:'2026-06-20',opt:'标准',cfg:'标配/白色',note:'新品上市铺货',price:2800,amt:364000,ship:'海运计收',type:'订单型',pFrom:'深圳港',pTo:'新加坡港',trans:'海运',trade:'CIF',custCode:'C10091',custName:'广州供应链',crt:'2026-08-02 16:30',crtBy:'王五',apTime:'—',modBy:'王五',mod:'2026-08-02 16:30',status:'已驳回',...baseRows[2]},
 {ver:'V-Z04-202608-001',doc:'HF-240804',apNo:'AP-MTS-003',src:'历史销售预测',dt:'mts备货',qtyB:30,qtyA:60,inDate:'2026-07-20',dlvDate:'2026-08-05',opt:'标准',cfg:'标配/128GB',note:'MTS滚动预测',price:1800,amt:108000,ship:'陆运计收',type:'储备型',pFrom:'天津港',pTo:'—',trans:'陆运',trade:'—',custCode:'C10078',custName:'北京科技',crt:'2026-08-03 11:00',crtBy:'张三',apTime:'2026-08-03 15:00',modBy:'张三',mod:'2026-08-03 12:00',status:'已通过',...baseRows[3]}
];
let ratioRows=[
 {no:1,predType:'历史销售预测',warCode:'W01',warName:'华东作战区',zoneCode:'Z01',zoneName:'沪苏国区',areaCode:'A01',areaName:'华东大区',cCode:'CN',cName:'中国',rate:[20,18,16,14,12,10],crt:'2026-08-01 09:00',status:'停用'},
 {no:2,predType:'历史销售预测',warCode:'W03',warName:'珠三角作战区',zoneCode:'Z03',zoneName:'粤泰国区',areaCode:'A02',areaName:'华南大区',cCode:'SG',cName:'新加坡',rate:[25,20,18,15,12,10],crt:'2026-08-02 09:00',status:'启用'}
];
let exceptionRows=detailRows.filter(x=>x.src==='例外需求').concat([{...detailRows[2],src:'例外需求',doc:'EX-240805',status:'已撤回',apNo:'AP-FB-005',dt:'风险备货'}]);
function tag(s){return `<span class="tag ${statusCls[s]||'graytag'}">${s}</span>`}function qty(i,j){let b=60+i*25+j*6,a=b+(j%3+1)*12;return [b,a]}function monthSub(){return months.map(m=>`<th>${m}<br><span style="font-weight:400;color:#98a2b3">前/后</span></th>`).join('')}function monthCells(row,click){return months.map((m,j)=>{let q=qty(row.pCode.charCodeAt(1)||1,j);let inner=`${q[0]} / <b>${q[1]}</b>`;return `<td>${click?`<span class="num" onclick="openCountryQty('${row.cCode}','${row.pCode}','${m}')">${inner}</span>`:inner}</td>`}).join('')}
function setPage(p){document.querySelectorAll('.m2').forEach(x=>x.classList.toggle('on',x.dataset.page===p)); if(p==='summary')summary(); else if(p==='ratio')ratioPage(); else if(p==='exception')exceptionPage(); else placeholder(p)}
document.querySelectorAll('.m2').forEach(x=>x.onclick=()=>setPage(x.dataset.page));
function filters(extra=''){return `<div class="card bar"><label>事业部</label><select><option>全部</option><option>电子事业部</option><option>通信事业部</option></select><label>大区</label><select><option>全部</option><option>华东大区</option><option>华南大区</option></select><label>国区</label><select><option>全部</option><option>沪苏国区</option><option>粤泰国区</option></select><label>月份</label><select>${months.map(x=>`<option>${x}</option>`).join('')}</select><button class="btn">查询</button><button class="btn ghost">重置</button>${extra}</div>`}
function summary(){app.innerHTML=`<div class="crumb">销售预测 / <b>销售预测3+9需求汇总</b></div><div class="tabs"><div class="tab on" data-tab="area">大区维度汇总表</div><div class="tab" data-tab="zone">国区维度汇总表</div><div class="tab" data-tab="country">国家维度汇总表</div><div class="tab" data-tab="detail">明细表</div></div><div id="sumBody"></div>`;document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>sumTab(t.dataset.tab));sumTab('area')}
function sumTab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===t));let b=document.getElementById('sumBody');if(t==='area')b.innerHTML=filters(`<button class="btn ghost" onclick="exportFile('销售预测3+9需求汇总_大区维度','大区维度汇总表字段与列表一致')">导出</button>`)+areaTable();if(t==='zone')b.innerHTML=filters(`<button class="btn ghost" onclick="exportFile('销售预测3+9需求汇总_国区维度','国区维度汇总表字段与列表一致')">导出</button>`)+zoneTable();if(t==='country')b.innerHTML=filters(`<button class="btn ghost" onclick="exportFile('销售预测3+9需求汇总_国家维度','国家维度汇总表字段与列表一致')">导出</button>`)+countryTable();if(t==='detail')b.innerHTML=detailToolbar()+detailTable()}
function areaTable(){let rows=[...new Map(baseRows.map(r=>[r.areaCode+'_'+r.pCode,r])).values()];return `<div class="hint">汇总维度：按大区 + 月份 + 产品编码汇总确定性需求、例外需求、历史销售预测的生效需求预测数量。</div><div class="tablebox"><table><thead><tr><th>大区编码</th><th>大区名称</th><th>机型</th><th>产品编码</th><th>产品名称</th><th colspan="13" class="monthHead">月度预测生效需求数量（修改前 / 修改后）</th><th>事业部名称</th><th>事业部编码</th><th>操作</th></tr><tr><th colspan="5"></th>${monthSub()}<th colspan="3"></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.areaCode}</td><td>${r.areaName}</td><td>${r.model}</td><td>${r.pCode}</td><td>${r.pName}</td>${monthCells(r,false)}<td>${r.bu}</td><td>${r.buCode}</td><td class="op"><a onclick="sumTab('zone')">查看详情</a></td></tr>`).join('')}</tbody></table></div>`}
function zoneTable(){return `<div class="hint">汇总维度：按国区 + 月份 + 产品编码汇总所有单据号。</div><div class="tablebox"><table><thead><tr><th>国区编码</th><th>国区名称</th><th>机型</th><th>产品编码</th><th>产品名称</th><th colspan="13" class="monthHead">月度预测生效需求数量（修改前 / 修改后）</th><th>大区编码</th><th>大区名称</th><th>事业部名称</th><th>事业部编码</th><th>操作</th></tr><tr><th colspan="5"></th>${monthSub()}<th colspan="5"></th></tr></thead><tbody>${baseRows.map(r=>`<tr><td>${r.zoneCode}</td><td>${r.zoneName}</td><td>${r.model}</td><td>${r.pCode}</td><td>${r.pName}</td>${monthCells(r,false)}<td>${r.areaCode}</td><td>${r.areaName}</td><td>${r.bu}</td><td>${r.buCode}</td><td class="op"><a onclick="sumTab('country')">查看详情</a></td></tr>`).join('')}</tbody></table></div>`}
function countryTable(){return `<div class="hint">汇总维度：按国家 + 月份 + 产品编码汇总。蓝色数量可点击查看国家汇总表明细列表弹窗。</div><div class="tablebox"><table><thead><tr><th>作战区域编码</th><th>作战区域名称</th><th>国家编码</th><th>国家名称（目的国）</th><th>机型</th><th>产品编码</th><th>产品名称</th><th colspan="13" class="monthHead">月度预测生效需求数量（修改前 / 修改后）</th><th>国区编码</th><th>国区名称</th><th>大区编码</th><th>大区名称</th><th>事业部名称</th><th>事业部编码</th><th>操作</th></tr><tr><th colspan="7"></th>${monthSub()}<th colspan="7"></th></tr></thead><tbody>${baseRows.map(r=>`<tr><td>${r.warCode}</td><td>${r.warName}</td><td>${r.cCode}</td><td>${r.cName}</td><td>${r.model}</td><td>${r.pCode}</td><td>${r.pName}</td>${monthCells(r,true)}<td>${r.zoneCode}</td><td>${r.zoneName}</td><td>${r.areaCode}</td><td>${r.areaName}</td><td>${r.bu}</td><td>${r.buCode}</td><td class="op"><a onclick="sumTab('detail')">查看详情</a></td></tr>`).join('')}</tbody></table></div>`}
function detailToolbar(){return `<div class="card"><div class="bar"><button class="btn" onclick="publishVer()">发布版本</button><button class="btn" onclick="changeStatus(['草稿','已驳回'],'审批中','提交审批：仅最新版本草稿/已驳回可提交，按需求类型生成审批单据号')">提交审批</button><button class="btn ghost" onclick="changeStatus(['审批中'],'已撤回','撤回：仅审批中可撤回，按版本撤回')">撤回</button><button class="btn ghost" onclick="changeStatus(['已驳回','已撤回'],'已废弃','废弃：仅已驳回/已撤回可废弃')">废弃</button><button class="btn ghost" onclick="exportFile('销售预测3+9需求汇总_需求汇总明细','明细表字段与列表一致，按当前查询条件导出且不受分页限制')">导出</button></div><div class="hint">审批状态范围：草稿、审批中、已驳回、已撤回、已通过、已废弃。数据来源范围：确定性需求、例外需求、历史销售预测。需求类型：风险备货、mts备货、退市产品需求提报、新品上市需求提报、其他类型。</div></div>`}
function detailTable(){return `<div class="tablebox"><table><thead><tr>${['版本号','单据号','审批单据号','数据来源（需求预测类型）','需求类型','作战区域编码','作战区域名称','国家编码','国家名称（目的国）','机型','产品编码','产品名称','选配','配置说明','需求备注','生效需求数量（修改前）','生效需求数量（修改后）','预计入库日期','要求交货日期','单价','总金额','发运计收','订单型/储备型','港口（起运港）','港口（目的港）','运输方式','贸易术语','国区编码','国区名称','大区编码','大区名称','事业部名称','事业部编码','客户编码','客户名称','创建时间','创建人','审批通过时间','修改人','修改时间','审批状态','操作栏'].map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${detailRows.map((d,i)=>detailTr(d,i)).join('')}</tbody></table></div>`}
function detailTr(d,i){let canEdit=d.src==='历史销售预测',canDel=d.status==='草稿'&&d.src==='历史销售预测';return `<tr><td>${d.ver}</td><td>${d.doc}</td><td>${d.apNo}</td><td>${d.src}</td><td>${d.dt}</td><td>${d.warCode}</td><td>${d.warName}</td><td>${d.cCode}</td><td>${d.cName}</td><td>${d.model}</td><td>${d.pCode}</td><td>${d.pName}</td><td>${d.opt}</td><td>${d.cfg}</td><td>${d.note}</td><td>${d.qtyB}</td><td><b>${d.qtyA}</b></td><td>${d.inDate}</td><td>${d.dlvDate}</td><td>${d.price}</td><td>${d.amt}</td><td>${d.ship}</td><td>${d.type}</td><td>${d.pFrom}</td><td>${d.pTo}</td><td>${d.trans}</td><td>${d.trade}</td><td>${d.zoneCode}</td><td>${d.zoneName}</td><td>${d.areaCode}</td><td>${d.areaName}</td><td>${d.bu}</td><td>${d.buCode}</td><td>${d.custCode}</td><td>${d.custName}</td><td>${d.crt}</td><td>${d.crtBy}</td><td>${d.apTime}</td><td>${d.modBy}</td><td>${d.mod}</td><td>${tag(d.status)}</td><td class="op"><a class="${canEdit?'':'disabled'}" onclick="${canEdit?`editHistory(${i})`:'void(0)'}">编辑</a><a class="${canDel?'':'disabled'}">删除</a></td></tr>`}

function publishVer(){openModal('发布版本确认',`<p style="font-size:15px;margin:10px 0">确认发布新的需求计划么？</p><p class="hint">发布版本以国区维度发布：同一个国区维度的3+9需求数据生成1个版本；不同国区生成不同版本号，并与销售预测、例外需求、历史销售预测保持一致。发布成功的初始审批状态为草稿。</p>`,`<button class="btn" onclick="doPublish()">是</button><button class="btn ghost" onclick="closeModal()">取消</button>`)}function doPublish(){detailRows.forEach(d=>{d.ver='V-'+d.zoneCode+'-'+new Date().getFullYear()+'08-NEW';d.status='草稿'});closeModal();sumTab('detail');alert('发布成功，已按国区生成新版本号，初始审批状态为草稿。')}
function changeStatus(from,to,msg){let changed=0;detailRows.forEach(d=>{if(from.includes(d.status)){d.status=to;changed++}});sumTab('detail');alert(`${msg}\n处理成功 ${changed} 行，其它状态自动跳过。`)}function editHistory(i){let d=detailRows[i]||detailRows[0];if(d.src!=='历史销售预测'){alert('仅历史销售预测的需求数量可修改');return}openModal('修改历史销售预测需求数量',`<div class="formgrid"><div class="field"><label>单据号</label><input value="${d.doc}" disabled></div><div class="field"><label>数据来源</label><input value="${d.src}" disabled></div><div class="field"><label>产品编码</label><input value="${d.pCode}" disabled></div><div class="field"><label class="req">需求数量</label><input id="editQty" value="${d.qtyA}"></div></div><p class="hint">修改页面仅展示历史销售预测的需求明细，仅历史销售预测的需求数量可修改。</p>`,`<button class="btn" onclick="saveEdit(${i})">保存</button><button class="btn ghost" onclick="closeModal()">关闭</button>`)}function saveEdit(i){let v=+document.getElementById('editQty').value;if(!Number.isInteger(v)||v<=0){alert('请填写正整数！');return}detailRows[i].qtyA=v;detailRows[i].mod=new Date().toLocaleString();closeModal();sumTab('detail');alert('保存成功')}
function ratioPage(){app.innerHTML=`<div class="crumb">销售预测 / <b>历史销售预测计算比例维护</b></div><div class="card"><div style="display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:12px;align-items:end"><div class="field"><label>预测类型</label><select multiple size="1"><option selected>历史销售预测</option><option>确定性需求</option><option>例外需求</option></select></div><div class="field"><label>作战区域编码/名称</label><select multiple size="1"><option>W01 华东作战区</option><option>W03 珠三角作战区</option></select></div><div class="field"><label>国区编码/名称</label><select multiple size="1"><option>Z01 沪苏国区</option><option>Z03 粤泰国区</option></select></div><div class="field"><label>大区编码/名称</label><select multiple size="1"><option>A01 华东大区</option><option>A02 华南大区</option></select></div><div class="field"><label>创建时间起</label><input type="datetime-local"></div><div class="field"><label>创建时间止</label><input type="datetime-local"></div><div class="field"><label>&nbsp;</label><button class="btn">查询</button><button class="btn ghost" style="margin-left:8px">重置</button></div></div><div class="hint">查询条件按每行 4 个条件排列；预测类型、作战区域、国区、大区均为下拉框，原型中通过多选下拉支持单选和多选。</div></div><div class="card"><div class="bar"><button class="btn" onclick="ratioEdit('新增')">新增</button><button class="btn ghost" onclick="ratioBatchDelete()">删除</button><button class="btn ghost" onclick="exportFile('需求预测数量计算比例维护数据','序号、预测类型、国家编码、国家名称、M、M1、M2、M3、M4~M6、M7~M12、作战区域编码、作战区域名称、大区编码、大区名称、国区编码、国区名称、状态、操作')">导出</button></div><div class="hint">列表字段顺序已调整：预测类型位于序号后；国家维度后展示历史销售预测计算比例（M、M1、M2、M3、M4~M6、M7~M12）；组织编码名称字段后置；状态和操作栏固定在右侧。</div></div><div class="tablebox"><table><thead><tr>${['序号','预测类型','国家编码','国家名称','M','M1','M2','M3','M4~M6','M7~M12','作战区域编码','作战区域名称','国区编码','国区名称','大区编码','大区名称','创建时间'].map(x=>`<th>${x}</th>`).join('')}<th style="position:sticky;right:88px;background:#f8fafc;z-index:4">状态</th><th style="position:sticky;right:0;background:#f8fafc;z-index:4">操作</th></tr></thead><tbody>${ratioRows.map((r,i)=>`<tr><td>${r.no}</td><td>${r.predType}</td><td>${r.cCode}</td><td>${r.cName}</td>${r.rate.map(x=>`<td>${x}%</td>`).join('')}<td>${r.warCode}</td><td>${r.warName}</td><td>${r.zoneCode}</td><td>${r.zoneName}</td><td>${r.areaCode}</td><td>${r.areaName}</td><td>${r.crt}</td><td style="position:sticky;right:88px;background:#fff;z-index:3">${r.status==='启用'?'<span class="tag green">启用</span>':'<span class="tag graytag">停用</span>'}</td><td class="op" style="position:sticky;right:0;background:#fff;z-index:3"><a onclick="ratioView(${i})">查看详情</a><a class="${r.status==='停用'?'':'disabled'}" onclick="${r.status==='停用'?`ratioEdit('编辑',${i})`:'void(0)'}">编辑</a><a onclick="toggleRatio(${i})">${r.status==='启用'?'停用':'启用'}</a><a class="${r.status==='停用'?'':'disabled'}">删除</a></td></tr>`).join('')}</tbody></table></div>`}
function ratioEdit(mode,i){let r=ratioRows[i]||{predType:'历史销售预测',warCode:'',warName:'',zoneCode:'',zoneName:'',areaCode:'',areaName:'',cCode:'',cName:'',rate:[20,18,16,14,12,10]};openModal(`${mode}历史销售预测计算比例`,ratioForm(r,false),`<button class="btn" onclick="addRatioBlock()">添加</button><button class="btn" onclick="saveRatio('${mode}',${i??-1})">保存</button><button class="btn ghost" onclick="closeModal()">关闭</button>`)}function ratioView(i){openModal('查看计算比例详情（只读）',ratioForm(ratioRows[i],true),`<button class="btn ghost" onclick="closeModal()">关闭</button>`)}function ratioForm(r,ro){return `<div id="ratioBlocks">${ratioBlock(r,ro,0)}</div><p class="hint">新增页面分为“组织配置”和“预测月份计算比例维护”两部分；添加/删除会同时增加或移除这两部分。作战区域编码、国家编码必填且为下拉多选框，名称和大区/国区信息根据编码自动带出不可编辑；比例只能填0～100整数，输入框后带%。</p>`}function ratioBlock(r,ro,idx){return `<div class="card ratioBlock" style="border:1px solid #e4e7ec"><div style="display:flex;align-items:center;margin-bottom:10px"><h4 style="color:#173763;margin:0">组织配置 #${idx+1}</h4>${ro?'':`<button class="btn ghost" style="margin-left:auto" onclick="removeRatioBlock(this)">删除</button>`}</div><div class="formgrid"><div class="field"><label class="req">作战区域编码</label><select id="warCode${idx}" ${ro?'disabled':''} onchange="fillOrg(${idx})"><option value="">请选择</option><option value="W01" ${r.warCode==='W01'?'selected':''}>W01</option><option value="W03" ${r.warCode==='W03'?'selected':''}>W03</option></select></div><div class="field"><label>作战区域名称</label><input id="warName${idx}" value="${r.warName||''}" disabled></div><div class="field"><label class="req">国家编码</label><select id="cCode${idx}" ${ro?'disabled':''} onchange="fillOrg(${idx})"><option value="">请选择</option><option value="CN" ${r.cCode==='CN'?'selected':''}>CN</option><option value="SG" ${r.cCode==='SG'?'selected':''}>SG</option></select></div><div class="field"><label>国家名称</label><input id="cName${idx}" value="${r.cName||''}" disabled></div><div class="field"><label>大区编码</label><input id="areaCode${idx}" value="${r.areaCode||''}" disabled></div><div class="field"><label>大区名称</label><input id="areaName${idx}" value="${r.areaName||''}" disabled></div><div class="field"><label>国区编码</label><input id="zoneCode${idx}" value="${r.zoneCode||''}" disabled></div><div class="field"><label>国区名称</label><input id="zoneName${idx}" value="${r.zoneName||''}" disabled></div></div><h4 style="color:#173763;margin:14px 0 8px">预测月份计算比例维护</h4><table><thead><tr>${['M','M1','M2','M3','M4~M6','M7~M12'].map(m=>`<th>${m}</th>`).join('')}</tr></thead><tbody><tr>${['M','M1','M2','M3','M4~M6','M7~M12'].map((m,k)=>`<td><input id="rate${idx}_${k}" value="${r.rate[k]}" ${ro?'disabled':''} style="width:62px;height:28px;border:1px solid #d0d5dd;border-radius:4px;padding:0 6px"> %</td>`).join('')}</tr></tbody></table></div>`}function fillOrg(idx){let c=document.getElementById('cCode'+idx)?.value, w=document.getElementById('warCode'+idx)?.value;let map={CN:{cName:'中国',areaCode:'A01',areaName:'华东大区',zoneCode:'Z01',zoneName:'沪苏国区'},SG:{cName:'新加坡',areaCode:'A02',areaName:'华南大区',zoneCode:'Z03',zoneName:'粤泰国区'}};let war={W01:'华东作战区',W03:'珠三角作战区'};if(document.getElementById('warName'+idx))document.getElementById('warName'+idx).value=war[w]||'';if(map[c])['cName','areaCode','areaName','zoneCode','zoneName'].forEach(k=>document.getElementById(k+idx).value=map[c][k])}function addRatioBlock(){let n=document.querySelectorAll('.ratioBlock').length;document.getElementById('ratioBlocks').insertAdjacentHTML('beforeend',ratioBlock({warCode:'',warName:'',zoneCode:'',zoneName:'',areaCode:'',areaName:'',cCode:'',cName:'',rate:[20,18,16,14,12,10]},false,n))}function removeRatioBlock(btn){let bs=document.querySelectorAll('.ratioBlock');if(bs.length<=1){alert('至少保留一组组织配置和计算比例维护。');return}btn.closest('.ratioBlock').remove()}function saveRatio(mode,i){let idx=0,war=document.getElementById('warCode0').value,c=document.getElementById('cCode0').value;if(!war||!c){alert('作战区域/国家/计算比例是必填字段，请填写！');return}let rates=[0,1,2,3,4,5].map(k=>+document.getElementById('rate0_'+k).value);if(rates.some(x=>!Number.isInteger(x)||x<0||x>100)){alert('请填写0～100的整数！');return}let row={no:ratioRows.length+1,predType:'历史销售预测',warCode:war,warName:document.getElementById('warName0').value,areaCode:document.getElementById('areaCode0').value,areaName:document.getElementById('areaName0').value,zoneCode:document.getElementById('zoneCode0').value,zoneName:document.getElementById('zoneName0').value,cCode:c,cName:document.getElementById('cName0').value,rate:rates,crt:new Date().toLocaleString(),status:'停用'};if(mode==='新增')ratioRows.unshift(row);else ratioRows[i]={...ratioRows[i],...row,no:ratioRows[i].no};closeModal();ratioPage();alert('保存成功，列表已刷新。')}function toggleRatio(i){ratioRows[i].status=ratioRows[i].status==='启用'?'停用':'启用';ratioPage()}function ratioBatchDelete(){alert('批量删除：自动跳过启用状态数据；未勾选时提示“请选择数据！”。')}
function exceptionPage(){app.innerHTML=`<div class="crumb">销售预测 / <b>例外需求</b></div><div class="tabs"><div class="tab on" data-etab="sum">例外需求汇总表</div><div class="tab" data-etab="det">例外需求明细表</div></div><div id="exBody"></div>`;document.querySelectorAll('[data-etab]').forEach(t=>t.onclick=()=>exTab(t.dataset.etab));exTab('sum')}function exTab(t){document.querySelectorAll('[data-etab]').forEach(x=>x.classList.toggle('on',x.dataset.etab===t));exBody.innerHTML=t==='sum'?exceptionSummary():exceptionDetail()}function exceptionSummary(){return filters(`<button class="btn ghost" onclick="exportFile('例外需求汇总表','导出字段及顺序按列表字段')">导出</button>`)+`<div class="hint">汇总维度：按产品编码维度展示，1个产品编码展示为1行数据。</div><div class="tablebox"><table><thead><tr><th>作战区域编码</th><th>作战区域名称</th><th>国家编码</th><th>国家名称（目的国）</th><th>机型</th><th>产品编码</th><th>产品名称</th><th colspan="13" class="monthHead">月度预测生效需求数量（修改前 / 修改后）</th><th>国区编码</th><th>国区名称</th><th>大区编码</th><th>大区名称</th><th>事业部名称</th><th>事业部编码</th><th>操作栏</th></tr><tr><th colspan="7"></th>${monthSub()}<th colspan="7"></th></tr></thead><tbody>${exceptionRows.map(r=>`<tr><td>${r.warCode}</td><td>${r.warName}</td><td>${r.cCode}</td><td>${r.cName}</td><td>${r.model}</td><td>${r.pCode}</td><td>${r.pName}</td>${monthCells(r,false)}<td>${r.zoneCode}</td><td>${r.zoneName}</td><td>${r.areaCode}</td><td>${r.areaName}</td><td>${r.bu}</td><td>${r.buCode}</td><td class="op"><a onclick="exTab('det')">查看详情</a></td></tr>`).join('')}</tbody></table></div>`}function exceptionDetail(){let toolbar=`<div class="card"><div class="bar">${['提交审批','撤回','废弃','删除','编辑','新增','导入','下载导入模版'].map(x=>`<button class="btn ${x==='删除'?'danger':x==='新增'?'':'ghost'}" onclick="exceptionAction('${x}')">${x}</button>`).join('')}</div><div class="hint">明细表按产品编码 + 预计入库日期维度展示；提交审批/撤回/废弃分别按需求类型、审批单据号规则联动状态。</div></div>`;return toolbar+`<div class="tablebox"><table><thead><tr>${['单据号','行号','审批单据号','需求类型','事业部名称','事业部编码','机型','产品编码','产品名称','选配','配置说明','需求备注','生效需求数量（修改前）','生效需求数量（修改后）','预计入库日期','要求交货日期','作战区域编码','作战区域名称','国家编码','国家名称（目的国）','大区编码','大区名称','国区编码','国区名称','单价','总金额','发运计收','订单型/储备型','港口（起运港）','港口（目的港）','运输方式','贸易术语','客户编码','客户名称','创建时间','创建人','修改人','修改时间','版本号','审批通过时间','审批状态','操作栏'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${exceptionRows.map((d,i)=>`<tr><td>${d.doc}</td><td>${i+1}</td><td>${d.apNo}</td><td>${d.dt}</td><td>${d.bu}</td><td>${d.buCode}</td><td>${d.model}</td><td>${d.pCode}</td><td>${d.pName}</td><td>${d.opt}</td><td>${d.cfg}</td><td>${d.note}</td><td>${d.qtyB}</td><td>${d.qtyA}</td><td>${d.inDate}</td><td>${d.dlvDate}</td><td>${d.warCode}</td><td>${d.warName}</td><td>${d.cCode}</td><td>${d.cName}</td><td>${d.areaCode}</td><td>${d.areaName}</td><td>${d.zoneCode}</td><td>${d.zoneName}</td><td>${d.price}</td><td>${d.amt}</td><td>${d.ship}</td><td>${d.type}</td><td>${d.pFrom}</td><td>${d.pTo}</td><td>${d.trans}</td><td>${d.trade}</td><td>${d.custCode}</td><td>${d.custName}</td><td>${d.crt}</td><td>${d.crtBy}</td><td>${d.modBy}</td><td>${d.mod}</td><td>${d.ver}</td><td>${d.apTime}</td><td>${tag(d.status)}</td><td class="op"><a onclick="viewOnly()">查看详情</a><a class="${['草稿','已驳回','已撤回'].includes(d.status)?'':'disabled'}">编辑</a><a class="${['草稿','已废弃'].includes(d.status)?'':'disabled'}">删除</a></td></tr>`).join('')}</tbody></table></div>`}function exceptionAction(a){const msg={提交审批:'仅草稿、已驳回、已撤回可提交；未选中可提交审批数据行时提示。',撤回:'仅审批中可撤回，按审批单据号撤回。',废弃:'仅已驳回、已撤回可废弃，按审批单据号废弃。',删除:'仅草稿、已废弃且自己新增/导入的数据可删除。',编辑:'仅自己新增/导入且草稿、已驳回、已撤回可编辑。',新增:'弹出新增弹窗，例外单据号自动生成，产品信息至少一行。',导入:'支持Excel上传，导入状态：导入中、导入成功、导入失败。',下载导入模版:'下载：例外需求提报导入模版.xlsx，第一行为表头，第二行为示例说明。'};alert(msg[a])}function viewOnly(){openModal('例外需求查看详情（只读）','<p>只能查看和关闭页面，不能进行任何操作。</p>')}
function placeholder(p){const name={history:'历史销售预测',certain:'确定性需求'}[p]||p;app.innerHTML=`<div class="crumb">销售预测 / <b>${name}</b></div><div class="card"><h3 style="color:#173763;margin-bottom:8px">${name}</h3><p>该菜单用于承载${name}业务页面，本次需求重点已在3+9需求汇总、例外需求、历史销售预测计算比例维护中实现。</p></div>`}
function openModal(title,body,foot){modalTitle.innerHTML=title;modalBody.innerHTML=body;modalFoot.innerHTML=foot||'<button class="btn ghost" onclick="closeModal()">关闭</button>';modalMask.style.display='flex';document.getElementById('modal').classList.toggle('small',title.includes('确认'))}function closeModal(){modalMask.style.display='none'}function exportFile(name,desc){let now=new Date(),pad=n=>String(n).padStart(2,'0');let fmt=name.includes('比例')?`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}：${pad(now.getMinutes())}：${pad(now.getSeconds())}`:`${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;let file=`${name}_${fmt}.xlsx`;alert(`导出成功：${file}\n${desc}\n系统按当前查询条件导出全部匹配数据，不受分页限制，并按登录账号角色数据权限导出。`)}
setPage('summary');
</script>
</body>
</html>
