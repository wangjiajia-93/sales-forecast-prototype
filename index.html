function recent30Days() { let end = new Date(); let start = new Date(); start.setDate(start.getDate() - 29); let fmt = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); return { start: fmt(start), end: fmt(end) }; }

function qSelect(label, opts, opts2) {
  let multi = opts2 && opts2.multi !== false;

      '</div>' +
      '<div class="hint">支持模糊搜索，不加载全量数据</div>' +
      '</div>';
  }

  // 普通模式：加载所有选项

    '</select>' + (ph ? '<div class="hint">' + ph + '</div>' : '') + '</div>';
}

// 显示远程下拉框
function showRemoteDropdown(input) {
  let id = input.id;
  let dropdown = document.getElementById(id + '_dropdown');
  if (dropdown) {
    dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
  }
}

// 远程搜索过滤
function filterRemoteOptions(input, id) {
  let dropdown = document.getElementById(id + '_dropdown');
  if (!dropdown) return;
  
  let keyword = input.value.trim().toLowerCase();
  let label = input.closest('.field').querySelector('label').textContent;
  let allOpts = getRemoteData(label);
  
  // 清空现有选项（保留"全部"）
  let firstOpt = dropdown.querySelector('.remote-opt');
  dropdown.innerHTML = '';
  
  // 添加"全部"选项
  let allDiv = document.createElement('div');
  allDiv.className = 'remote-opt';
  allDiv.style.cssText = 'padding:6px 12px;cursor:pointer;background:#f5f5f5';
  allDiv.textContent = '全部';
  allDiv.onclick = function() { selectRemoteOption(this, id); };
  dropdown.appendChild(allDiv);
  
  // 如果有搜索词，添加匹配项
  if (keyword) {
    let matched = allOpts.filter(function(o) {
      return o.toLowerCase().indexOf(keyword) !== -1;
    });
    matched.forEach(function(o) {
      let div = document.createElement('div');
      div.className = 'remote-opt';
      div.style.cssText = 'padding:6px 12px;cursor:pointer';
      div.textContent = o;
      div.onclick = function() { selectRemoteOption(this, id); };
      dropdown.appendChild(div);
    });
  }
  
  dropdown.style.display = 'block';
}

// 选择远程选项
function selectRemoteOption(optDiv, inputId) {
  let input = document.getElementById(inputId);
  if (input) {
    input.value = optDiv.textContent;
  }
  let dropdown = document.getElementById(inputId + '_dropdown');
  if (dropdown) {
    dropdown.style.display = 'none';
  }
}

function qMonth(label, opts2) {
  let req = opts2 && opts2.req;
  let def = (opts2 && opts2.def) || currentMonth();
  // 使用 type="month" 确保是月份选择器，格式为 YYYY-MM
  // 注意：不添加任何 min/max/disabled 属性，允许自由选择过去或未来的任意月份

}

// 日期范围选择器（默认单框显示）
function qDateRange(label, opts2) {
  let r = recent30Days();
  let defStart = (opts2 && opts2.defStart) || '';
  let defEnd = (opts2 && opts2.defEnd) || '';
  let merged = opts2 && opts2.merged !== false; // 默认合并显示

  if (merged) {
    // 合并显示模式：单个输入框显示范围，格式 YYYY/MM/DD ~ YYYY/MM/DD
    let displayValue = defStart && defEnd ? defStart.replace(/-/g, '/') + ' ~ ' + defEnd.replace(/-/g, '/') : '';
    return '<div class="field"><label>' + label + '</label><input type="text" readonly value="' + displayValue + '" style="cursor:pointer" title="点击选择日期范围" onclick="openDateRangePicker(this)"></div>';
  }
  // 非合并模式（保留兼容）
  return '<div class="field"><label>' + label + '</label><div style="display:flex;gap:6px;align-items:center"><input type="date" value="' + defStart + '"><span>~</span><input type="date" value="' + defEnd + '"></div></div>';
}

// 打开日期范围选择器
function openDateRangePicker(input) {
  let current = input.value;
  let defaultVal = recent30Days().start.replace(/-/g, '/') + ' ~ ' + recent30Days().end.replace(/-/g, '/');
  let newValue = prompt('请输入日期范围（格式：YYYY/MM/DD ~ YYYY/MM/DD）：', current || defaultVal);
  if (newValue !== null && newValue.trim()) {
    input.value = newValue.trim();

      qSelect('国区编码/国区名称', zone, { req: true, def: userInfo.zoneCode }),

}

function openExceptionSubmitApproval(){let idxs=exSelectedIndexes();if(!idxs.length){alert('请选择可提交审批的数据！');return}let rows=idxs.map(i=>exceptionRows[i]);const demandTypes=[...new Set(rows.map(r=>r.dt||'其他类型'))];if(demandTypes.length>1){alert('您选择的数据包含多种需求类型（'+demandTypes.join('、')+'），请确保每次仅勾选同一种需求类型的数据进行提交。');return}let apNo=genFxApNo();exApFiles=[];let dt=rows[0].dt||'其他类型';let content=`<div style="background:#f7faff;border:1px solid #e4e7ec;border-radius:6px;padding:12px 16px;margin-bottom:14px"><h3 style="color:#173763;margin:0;font-size:15px">张三（gw_zhangs）提交的例外需求申请 ${apNo}</h3></div><h4 style="color:#173763;margin:0 0 8px;font-size:14px">基本信息</h4><div class="formgrid" style="margin-bottom:14px"><div class="field"><label class="req">需求类型</label><select id="exDemandType" onchange="updateExApprovers(this.value)"><option${dt==='新品上市需求提报'?' selected':''}>新品上市需求提报</option><option${dt==='退市产品需求提报'?' selected':''}>退市产品需求提报</option><option${dt==='MTS备货'?' selected':''}>MTS备货</option><option${dt==='风险备货'?' selected':''}>风险备货</option><option${dt==='其他类型'||!dt?' selected':''}>其他类型</option></select></div><div class="field"><label>审批单据号</label><input value="${apNo}" disabled></div><div class="field"><label>申请人账号</label><input value="gw_zhangs" disabled></div><div class="field"><label>申请人姓名</label><input value="张三" disabled></div></div><div class="field" style="margin-bottom:14px"><label class="req">申请理由</label><textarea id="applyReason" style="width:100%;height:70px;border:1px solid #d0d5dd;border-radius:4px;padding:8px;font-family:inherit" placeholder="请输入申请理由"></textarea></div><h4 style="color:#173763;margin:0 0 8px;font-size:14px">需求明细列表</h4>${exApDetailTable(rows)}${apPager(rows.length)}${renderExApprovers(dt)}<div class="field" style="margin-bottom:14px"><label>添加附件</label><input type="file" multiple accept="image/*,.xls,.xlsx,.doc,.docx,.pdf" onchange="exApAddFiles(this)"><div class="hint">支持图片、Excel、Word、PDF；单文件≤30M，最多3个</div></div><h4 style="color:#173763;margin:0 0 8px;font-size:14px">附件列表</h4><div class="tablebox" style="max-height:180px"><table><thead><tr><th>文件名称</th><th>文件路径</th><th>文件ID</th><th style="position:sticky;right:0;background:#f8fafc;z-index:4">操作</th></tr></thead><tbody id="exApAttachBody"><tr><td colspan="4" style="text-align:center;color:#98a2b3;padding:16px">暂无附件，请上传</td></tr></tbody></table></div><p class="hint" style="margin-top:8px">审批发起后将生成审批单号，例外需求明细将导出为附件同步至BPP审批系统。</p>`;openModal('提交审批',content,`<button class="btn" onclick="launchApproval('ex','${idxs.join(',')}')">发起审批</button><button class="btn ghost" onclick="closeModal()">取消</button>`)}
function launchApproval(type,str){if(!document.getElementById('applyReason').value.trim()){alert('未填写申请理由！');return}if(!document.getElementById('ap1').selectedOptions.length){alert('未选择一级审批人！');return}let apNo=genFxApNo();str.split(',').map(Number).forEach(i=>{if(type==='ex'){exceptionRows[i].status='审批中';exceptionRows[i].apNo=apNo}else{detailRows[i].status='审批中';detailRows[i].apNo=apNo}});closeModal();if(type==='ex'){exTab('det')}else{sumTab('detail')}alert('已发起审批，所选数据状态已更新为审批中，并同步生成BPP审批单号。')}
function openCountryQty(c,p,m){let rows=detailRows.filter(x=>x.cCode===c&&x.pCode===p);if(!rows.length)rows=detailRows.slice(0,2);openModal(`国家汇总表明细列表 - ${c} / ${p} / ${m}`,`<div class="hint">点击“修改”跳转至销售预测3+9需求汇总明细表；修改页面仅允许修改历史销售预测来源的需求数量。</div><div class="tablebox" style="max-height:55vh"><table><thead><tr>${['单据号','数据来源（需求预测类型）','机型','产品编码','产品名称','选配','配置说明','需求备注','生效需求数量（修改前）','生效需求数量（修改后）','预计入库日期','要求交货日期','发运计收','订单型/储备型','港口（起运港）','港口（目的港）','运输方式','贸易术语','国区编码','国区名称','大区编码','大区名称','事业部名称','事业部编码','操作栏'].map(x=>x==='操作栏'?`<th style="position:sticky;right:0;background:#f8fafc;z-index:4">${x}</th>`:`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map((d,i)=>`<tr><td>${d.doc}</td><td>${d.src}</td><td>${d.model}</td><td>${d.pCode}</td><td>${d.pName}</td><td>${d.opt}</td><td>${d.cfg}</td><td>${d.note}</td><td>${d.qtyB}</td><td><b>${d.qtyA}</b></td><td>${d.inDate}</td><td>${d.dlvDate}</td><td>${d.ship}</td><td>${d.type}</td><td>${d.pFrom}</td><td>${d.pTo}</td><td>${d.trans}</td><td>${d.trade}</td><td>${d.zoneCode}</td><td>${d.zoneName}</td><td>${d.areaCode}</td><td>${d.areaName}</td><td>${d.bu}</td><td>${d.buCode}</td><td class="op" style="position:sticky;right:0;background:#fff;z-index:3"><a onclick="closeModal();sumTab('detail');editHistory(${i})">修改</a></td></tr>`).join('')}</tbody></table></div>`)}
function publishVer(){const warZones=['W01 华东作战区','W02 苏南作战区','W03 珠三角作战区','W04 华北作战区'];const bus=['BU01 电子事业部','BU02 通信事业部'];openModal('生成新版本配置',`<div class="formgrid"><div class="field"><label class="req">作战区域名称/编码（子公司）</label><select id="newVerWarZone"><option value="">请选择作战区域</option>${warZones.map(w=>`<option>${w}</option>`).join('')}</select><div class="hint">支持输入关键字模糊搜索，单选</div></div><div class="field"><label class="req">事业部编码/名称</label><select id="newVerBU"><option value="">请选择事业部</option>${bus.map(b=>`<option>${b}</option>`).join('')}</select><div class="hint">支持输入关键字模糊搜索，单选</div></div></div><p class="hint">生成版本以国区维度发布：同一个国区维度的3+9需求数据生成1个版本；不同国区生成不同版本号。生成成功的初始审批状态为草稿。</p>`,`<button class="btn" onclick="doPublish()">发起审批</button><button class="btn ghost" onclick="closeModal()">取消</button>`)}function doPublish(){const wz=document.getElementById('newVerWarZone').value;const bu=document.getElementById('newVerBU').value;if(!wz){alert('请选择作战区域名称/编码（子公司）！');return}if(!bu){alert('请选择事业部编码/名称！');return}const warCode=wz.split(' ')[0];const buCode=bu.split(' ')[0];detailRows.forEach(d=>{d.ver='V-'+d.zoneCode+'-'+new Date().getFullYear()+'08-NEW';d.status='草稿'});closeModal();sumTab('detail');alert('已发起审批，生成新版本成功。\n作战区域：'+wz+'\n事业部：'+bu+'\n版本号已按国区生成，初始审批状态为草稿。')}
function changeStatus(from,to,msg){let changed=0;detailRows.forEach(d=>{if(from.includes(d.status)){d.status=to;changed++}});sumTab('detail');alert(`${msg}\n处理成功 ${changed} 行，其它状态自动跳过。`)}function editHistory(i){let d=detailRows[i]||detailRows[0];if(d.src!=='历史销售预测'){alert('仅历史销售预测的需求数量可修改');return}openModal('修改历史销售预测需求数量',`<div class="formgrid"><div class="field"><label>单据号</label><input value="${d.doc}" disabled></div><div class="field"><label>数据来源</label><input value="${d.src}" disabled></div><div class="field"><label>产品编码</label><input value="${d.pCode}" disabled></div><div class="field"><label class="req">需求数量</label><input id="editQty" value="${d.qtyA}"></div></div><p class="hint">修改页面仅展示历史销售预测的需求明细，仅历史销售预测的需求数量可修改。</p>`,`<button class="btn" onclick="saveEdit(${i})">保存</button><button class="btn ghost" onclick="closeModal()">关闭</button>`)}function saveEdit(i){let v=+document.getElementById('editQty').value;if(!Number.isInteger(v)||v<=0){alert('请填写正整数！');return}detailRows[i].qtyA=v;detailRows[i].mod=new Date().toLocaleString();closeModal();sumTab('detail');alert('保存成功')}
function ratioPage(){app.innerHTML=`<div class="crumb">销售预测 / <b>历史销售预测计算比例维护</b></div><div class="card"><div style="display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:12px;align-items:end"><div class="field"><label>预测类型</label><select multiple size="1"><option selected>历史销售预测</option><option>确定性需求</option><option>例外需求</option></select></div><div class="field"><label>作战区域编码/名称</label><select multiple size="1"><option>W01 华东作战区</option><option>W03 珠三角作战区</option></select></div><div class="field"><label>国区编码/名称</label><select multiple size="1"><option>Z01 沪苏国区</option><option>Z03 粤泰国区</option></select></div><div class="field"><label>大区编码/名称</label><select multiple size="1"><option>A01 华东大区</option><option>A02 华南大区</option></select></div><div class="field"><label>创建时间起</label><input type="datetime-local"></div><div class="field"><label>创建时间止</label><input type="datetime-local"></div><div class="field"><label>&nbsp;</label><button class="btn">查询</button><button class="btn ghost" style="margin-left:8px">重置</button></div></div><div class="hint">查询条件按每行 4 个条件排列；预测类型、作战区域、国区、大区均为下拉框，原型中通过多选下拉支持单选和多选。</div></div><div class="card"><div class="bar"><button class="btn" onclick="ratioEdit('新增')">新增</button><button class="btn ghost" onclick="ratioBatchDelete()">删除</button><button class="btn ghost" onclick="exportFile('需求预测数量计算比例维护数据','序号、预测类型、国家编码、国家名称、M、M1、M2、M3、M4~M6、M7~M12、作战区域编码、作战区域名称、大区编码、大区名称、国区编码、国区名称、状态、操作')">导出</button></div><div class="hint">列表字段顺序已调整：预测类型位于序号后；国家维度后展示历史销售预测计算比例（M、M1、M2、M3、M4~M6、M7~M12）；组织编码名称字段后置；状态和操作栏固定在右侧。</div></div><div class="tablebox"><table><thead><tr>${['序号','预测类型','国家编码','国家名称','M','M1','M2','M3','M4~M6','M7~M12','作战区域编码','作战区域名称','国区编码','国区名称','大区编码','大区名称','创建时间'].map(x=>`<th>${x}</th>`).join('')}<th style="position:sticky;right:88px;background:#f8fafc;z-index:4">状态</th><th style="position:sticky;right:0;background:#f8fafc;z-index:4">操作</th></tr></thead><tbody>${ratioRows.map((r,i)=>`<tr><td>${r.no}</td><td>${r.predType}</t // 例外需求审批流程映射表：需求类型 → 审批节点列表
// 例外需求审批流程映射表：需求类型 → 审批节点列表
// 新品上市：拆分为6节点（关务组/商务&采购/生产部/产品规划部/国区交付供应部/营销）
const exApprovalFlowMap = {
  '新品上市需求提报': ['关务组审批人', '商务审批人', '采购审批人', '生产部审批人', '产品规划部审批人', '国区交付供应部审批人', '营销审批人'],
  '退市产品需求提报': ['营销子总', '国区交付供应部部长', '商务审批人', '采购审批人', '生产部审批人', '产品部审批人', '供应链审批人', '营销审批人'],
  'MTS备货': ['营销子总审批', '国区需求计划员审批', '国区交付供应部部长审批', '事业交付供应部计划负责人审批'],
  '风险备货': null,
  '其他类型': null
};

// 动态渲染审批人信息区域（不含添加附件，附件字段移至外部）
function renderExApprovers(demandType) {
  const nodes = exApprovalFlowMap[demandType];
  // 默认三级审批人（风险备货/其他类型/未匹配）
  if (!nodes) {
    return `<div id="exApproverWrap"><h4 style="color:#173763;margin:0 0 8px;font-size:14px">审批人信息</h4><div class="formgrid" style="margin-bottom:14px"><div class="field"><label class="req">一级审批人</label><select id="ap1"><option value="">请选择</option><option>leader01 张经理</option><option>leader02 李经理</option><option>leader03 周经理</option></select><div class="hint">下拉框，支持单选/多选，至少选择一个</div></div><div class="field"><label>二级审批人</label><select id="ap2"><option value="">请选择</option><option>manager01 王总监</option><option>manager02 赵总监</option><option>manager03 孙总监</option></select><div class="hint">下拉框，支持单选/多选，非必选</div></div><div class="field"><label>三级审批人</label><select id="ap3"><option value="">请选择</option><option>director01 刘总</option><option>director02 陈总</option><option>director03 黄总</option></select><div class="hint">下拉框，支持单选/多选，非必选</div></div></div></div>`;
  }
  // 动态生成审批节点（默认空值）
  let html = `<div id="exApproverWrap"><h4 style="color:#173763;margin:0 0 8px;font-size:14px">审批人信息</h4><div class="formgrid" style="margin-bottom:14px">`;
  nodes.forEach((node, idx) => {
    html += `<div class="field"><label class="req">${node}</label><select id="ap${idx+1}"><option value="">请选择</option><option>leader01 张经理</option><option>leader02 李经理</option><option>leader03 周经理</option><option>manager01 王总监</option><option>manager02 赵总监</option><option>director01 刘总</option><option>director02 陈总</option></select><div class="hint">下拉框，支持单选/多选，必填</div></div>`;
  });
  html += `</div></div>`;
  return html;
}

// 切换需求类型时更新审批人区域
function updateExApprovers(newType) {
  const wrap = document.getElementById('exApproverWrap');
  if (wrap) {
    wrap.outerHTML = renderExApprovers(newType);
  }
}


function placeholder(p){const name={history:'历史销售预测',certain:'确定性需求'}[p]||p;app.innerHTML=`<div class="crumb">销售预测 / <b>${name}</b></div><div class="card"><h3 style="color:#173763;margin-bottom:8px">${name}</h3><p>该菜单用于承载${name}业务页面，本次需求重点已在3+9需求汇总、例外需求、历史销售预测计算比例维护中实现。</p></div>`}
function openModal(title,body,foot){modalTitle.innerHTML=title;modalBody.innerHTML=body;modalFoot.innerHTML=foot||'<button class="btn ghost" onclick="closeModal()">关闭</button>';modalMask.style.display='flex';document.getElementById('modal').classList.toggle('small',title.includes('确认'))}function closeModal(){modalMask.style.display='none'}function exportFile(name,desc){let now=new Date(),pad=n=>String(n).padStart(2,'0');let fmt=name.includes('比例')?`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}：${pad(now.getMinutes())}：${pad(now.getSeconds())}`:`${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;let file=`${name}_${fmt}.xlsx`;alert(`导出成功：${file}\n${desc}\n系统按当前查询条件导出全部匹配数据，不受分页限制，并按登录账号角色数据权限导出。`)}
