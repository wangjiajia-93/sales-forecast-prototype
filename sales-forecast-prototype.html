<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>智能销售预测系统 - 高保真原型</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#262626;font-size:14px;line-height:1.5}
.layout{display:flex;min-height:100vh}
.sidebar{width:240px;min-height:100vh;background:#e6f7ff;color:#595959;display:flex;flex-direction:column;flex-shrink:0}
.logo{padding:20px 24px;font-size:18px;font-weight:700;color:#1890ff;border-bottom:1px solid rgba(24,144,255,.2);display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#1890ff,#36cfc9);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff}
.menu-group{padding:12px 0 4px}
.menu-title{padding:6px 24px 10px;font-size:11px;letter-spacing:1.2px;color:rgba(24,144,255,.5);font-weight:600}
.menu-item{display:flex;align-items:center;gap:10px;padding:11px 24px;cursor:pointer;transition:all .15s;font-size:14px;color:#595959;border-left:3px solid transparent}
.menu-item:hover{background:rgba(24,144,255,.15);color:#1890ff}
.menu-item.active{background:rgba(24,144,255,.15);color:#1890ff;border-left-color:#1890ff;font-weight:600}
.menu-icon{font-size:15px;width:20px;text-align:center}
.sidebar-footer{padding:12px 24px;text-align:center;border-top:1px solid rgba(24,144,255,.2);margin-top:auto;color:rgba(24,144,255,.45);font-size:11px}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:#f0f2f5}
.header{height:52px;background:#fff;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;padding:0 24px;flex-shrink:0}
.header .crumb{color:#8c8c8c;font-size:13px}.header .crumb-sep{margin:0 8px;color:#8c8c8c}.header .crumb-cur{font-weight:600;font-size:13px}
.content{flex:1;padding:20px 24px;overflow-y:auto;background:#f5f5f5}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row-between{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:1fr 1fr 1fr}.grid-4{grid-template-columns:1fr 1fr 1fr 1fr}.grid-5{grid-template-columns:1fr 1fr 1fr 1fr 1fr}.grid-6{grid-template-columns:repeat(6,1fr)}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.04);border:1px solid #f0f0f0}
.card-header{padding:12px 16px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center}
.card-header h3{font-size:15px;font-weight:600}
.card-body{padding:16px}.card-body-sm{padding:10px 16px}.card-body-none{padding:0}
h2{font-size:20px;font-weight:700;margin:0}
.text-sm{font-size:12px}.text-xs{font-size:11px}
.text-secondary{color:#8c8c8c}.text-tertiary{color:#bfbfbf}
.text-success{color:#52c41a}.text-warning{color:#faad14}.text-danger{color:#ff4d4f}.text-primary{color:#1890ff}
.font-semibold{font-weight:600}
.btn{padding:6px 16px;border-radius:4px;font-size:13px;cursor:pointer;border:1px solid #d9d9d9;background:#fff;color:#262626;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:#1890ff;color:#1890ff}
.btn-primary{background:#1890ff;color:#fff;border-color:#1890ff}.btn-primary:hover{background:#40a9ff;border-color:#40a9ff;color:#fff}
.btn-danger{color:#ff4d4f;border-color:#ff4d4f}.btn-danger:hover{background:#fff1f0}
.btn-sm{padding:4px 12px;font-size:12px}
.btn-link{background:none;border:none;color:#1890ff;cursor:pointer;font-size:12px;padding:2px 4px}.btn-link:hover{color:#40a9ff}
.btn-link-danger{background:none;border:none;color:#ff4d4f;cursor:pointer;font-size:12px;padding:2px 4px}
.btn-disabled{color:#d9d9d9!important;cursor:not-allowed!important;border-color:#d9d9d9!important;background:#f5f5f5!important}
.form-group{display:flex;flex-direction:column;gap:2px}
.form-label{font-size:12px;color:#8c8c8c}
.form-label .req{color:#ff4d4f;margin-right:2px}
input[type=text],input[type=number],select,textarea{padding:6px 10px;border:1px solid #d9d9d9;border-radius:4px;font-size:12px;outline:none;transition:border .15s;font-family:inherit}
input[type=text]:focus,select:focus,textarea:focus{border-color:#1890ff;box-shadow:0 0 0 2px rgba(24,144,255,.1)}
select{min-width:120px}
textarea{resize:vertical;min-height:60px}
.table-wrap{overflow:auto;background:#fff;border-radius:8px;border:1px solid #f0f0f0}
table{width:100%;border-collapse:collapse}
th{padding:8px 10px;font-size:12px;font-weight:600;background:#fafafa;border-bottom:2px solid #e8e8e8;white-space:nowrap;text-align:left;position:sticky;top:0;z-index:1}
td{padding:6px 10px;font-size:12px;border-bottom:1px solid #f0f0f0;white-space:nowrap}
tr:nth-child(even){background:#fafafa}tr:nth-child(odd){background:#fff}
.td-right{text-align:right}.td-center{text-align:center}
.stat{padding:16px}.stat-label{font-size:12px;color:#8c8c8c;margin-bottom:4px}.stat-value{font-size:24px;font-weight:700}.stat-unit{font-size:13px;font-weight:400;color:#8c8c8c;margin-left:4px}.stat-desc{font-size:11px;color:#8c8c8c;margin-top:2px}
.tag{display:inline-block;padding:1px 8px;border-radius:3px;font-size:11px}
.tag-blue{background:#e6f7ff;color:#1890ff}.tag-green{background:#f6ffed;color:#52c41a}.tag-orange{background:#fff7e6;color:#faad14}.tag-red{background:#fff2e8;color:#ff4d4f}.tag-gray{background:#f5f5f5;color:#8c8c8c}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.tabs{display:flex;border-bottom:2px solid #e8e8e8;gap:0}
.tab-btn{padding:10px 20px;font-size:13px;font-weight:400;color:#595959;background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;transition:all .15s}
.tab-btn:hover{color:#1890ff}.tab-btn.active{color:#1890ff;font-weight:600;border-bottom-color:#1890ff}
.action-bar{padding:12px 16px;background:#fff;border-radius:8px;border:1px solid #f0f0f0;margin-bottom:12px}.action-bar .row{gap:8px}
.query-bar{background:#fff;border-radius:8px;padding:12px 16px;border:1px solid #f0f0f0}
.pagination{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.page-btn{padding:4px 10px;font-size:12px;border:1px solid #d9d9d9;border-radius:4px;background:#fff;cursor:pointer}
.page-btn:hover{border-color:#1890ff;color:#1890ff}
.page-btn.active{background:#1890ff;color:#fff;border-color:#1890ff;font-weight:600}
.page-btn:disabled{color:#d9d9d9;cursor:not-allowed;border-color:#d9d9d9}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:8px;width:90%;max-height:85vh;overflow:auto;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.modal-header{padding:16px 24px;border-bottom:1px solid #f0f0f0;font-size:16px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:20px 24px}
.modal-footer{padding:12px 24px;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end;gap:8px}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:#8c8c8c}
.m-cell{min-width:80px;padding:4px 6px;text-align:right;font-size:12px;border-right:1px solid #f0f0f0}
.m-before{color:#8c8c8c;text-decoration:line-through;line-height:18px}
.m-after{color:#1890ff;font-weight:600;line-height:18px}
.m-clickable{cursor:pointer;border-radius:2px;transition:background .15s}
.m-clickable:hover{background:#e6f7ff}
.m-clickable .m-after{text-decoration:underline}
.legend{display:flex;gap:16px;align-items:center}
.legend-dot{width:12px;height:12px;border-radius:2px}
.chart-placeholder{height:280px;background:linear-gradient(135deg,#f0f5ff,#e6f7ff);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#1890ff;font-size:14px;border:1px dashed #91d5ff}
.spacer{flex:1}
.page{display:none}.page.active{display:block}
/* Approval Modal Specific */
.approval-section{margin-bottom:20px}
.approval-section-title{font-size:13px;font-weight:600;color:#262626;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #f0f0f0}
.approver-level{margin-bottom:12px;padding:10px;background:#fafafa;border-radius:6px;border:1px solid #f0f0f0}
.approver-level-label{font-size:12px;font-weight:600;color:#595959;margin-bottom:6px}
.approver-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.approver-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;background:#e6f7ff;border:1px solid #91d5ff;border-radius:12px;font-size:12px;color:#1890ff}
.approver-chip .chip-remove{cursor:pointer;font-size:14px;color:#8c8c8c;line-height:1}
.approver-chip .chip-remove:hover{color:#ff4d4f}
.file-upload-area{border:2px dashed #d9d9d9;border-radius:8px;padding:20px;text-align:center;cursor:pointer;transition:border-color .2s}
.file-upload-area:hover{border-color:#1890ff}
.file-list{margin-top:8px}
.file-item{display:flex;align-items:center;gap:8px;padding:4px 8px;background:#fafafa;border-radius:4px;margin-top:4px;font-size:12px}
.file-item .file-remove{color:#ff4d4f;cursor:pointer;margin-left:auto}
</style>
</head>
<body>
<div class="layout">
<nav class="sidebar">
<div class="logo"><div class="logo-icon">S</div>智能销售预测系统</div>
<div class="menu-group">
<div class="menu-title">销售预测</div>
<div class="menu-item active" onclick="switchPage('leading')"><span class="menu-icon">📈</span>先行指标预测</div>
<div class="menu-item" onclick="switchPage('historical')"><span class="menu-icon">📊</span>历史销售预测</div>
<div class="menu-item" onclick="switchPage('confirmed')"><span class="menu-icon">✅</span>确定性需求</div>
<div class="menu-item" onclick="switchPage('exception')"><span class="menu-icon">⚠️</span>例外需求</div>
<div class="menu-item" onclick="switchPage('ratio')"><span class="menu-icon">⚙️</span>计算比例维护</div>
<div class="menu-item" onclick="switchPage('summary')"><span class="menu-icon">📋</span>销售预测3+9需求汇总</div>
</div>
<div class="sidebar-footer">v1.0.0 高保真原型</div>
</nav>
<div class="main">
<header class="header"><span class="crumb">销售预测</span><span class="crumb-sep">/</span><span class="crumb-cur" id="curPage">先行指标预测</span></header>
<main class="content" id="pageContainer"></main>
</div>
</div>
<!-- 通用弹窗 -->
<div class="modal-overlay" id="modal"><div class="modal" style="max-width:680px"><div class="modal-header"><span id="modalTitle">弹窗</span><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="modal-body" id="modalBody"></div><div class="modal-footer" id="modalFooter"></div></div></div>
<!-- 提交审批弹窗 -->
<div class="modal-overlay" id="approvalModal">
<div class="modal" style="max-width:720px">
<div class="modal-header"><span>提交审批</span><button class="modal-close" onclick="closeApproval()">&times;</button></div>
<div class="modal-body" id="approvalBody"></div>
<div class="modal-footer">
<button class="btn" onclick="closeApproval()">取消</button>
<button class="btn btn-primary" onclick="submitApproval()">发起审批</button>
</div>
</div>
</div>
<script>
/* ═══ 数据定义 ═══ */
const M_LABELS=["M月","M+1","M+2","M+3","M+4","M+5","M+6","M+7","M+8","M+9","M+10","M+11","M+12"];
const PAGE_NAMES={leading:"先行指标预测",historical:"历史销售预测",confirmed:"确定性需求",exception:"例外需求",ratio:"计算比例维护",summary:"销售预测3+9需求汇总"};
const SCM_USERS=["张三","李四","王五","赵六","钱七","孙八","周九","吴十","郑十一","冯十二"];
let currentPage='leading',currentTab={exception:'summary',summary:'region'};
let approvalContext={source:'',selectedL1:[],selectedL2:[],selectedL3:[],reason:'',files:[]};

/* ═══ 工具函数 ═══ */
function $(s){return document.querySelector(s)}
function mkM(b,a){return b.map((v,i)=>({before:v,after:a[i]}))}
function mCell(m,clickable,onClick){
  const ch=m.before!==m.after;
  const cls=clickable?'m-cell m-clickable':'m-cell';
  const oc=onClick?`onclick="${onClick}"`:'';
  return `<div class="${cls}" ${oc}><div class="${ch?'m-before':''}" style="${ch?'':'color:#262626'}">${m.before}</div>${ch?`<div class="m-after">${m.after}</div>`:''}</div>`;
}
function statusPill(s){
  const c={"已通过":["#f6ffed","#52c41a"],"审批中":["#e6f7ff","#1890ff"],"草稿":["#f5f5f5","#8c8c8c"],"已驳回":["#fff2e8","#ff4d4f"],"已撤回":["#fff7e6","#faad14"],"已废弃":["#f0f0f0","#bfbfbf"],"新建":["#f5f5f5","#8c8c8c"]};
  const [bg,fg]=c[s]||["#f5f5f5","#8c8c8c"];
  return `<span class="pill" style="background:${bg};color:${fg}">${s}</span>`;
}
function sourceTag(s){
  const c={"确定性需求":["#f6ffed","#52c41a"],"例外需求":["#fff7e6","#faad14"],"历史销售预测":["#e6f7ff","#1890ff"]};
  const [bg,fg]=c[s]||["#f5f5f5","#8c8c8c"];
  return `<span class="tag" style="background:${bg};color:${fg}">${s}</span>`;
}
function pagination(total){
  return `<div class="pagination"><div class="row"><span class="text-sm text-secondary">每页显示</span><select onchange="this.value"><option>10条</option><option>20条</option><option>50条</option><option>100条</option></select><span class="text-sm text-secondary">共 ${total} 条记录</span></div><div class="row" style="gap:4px"><button class="page-btn" disabled>上一页</button><button class="page-btn active">1</button><button class="page-btn">下一页</button><span class="text-sm text-secondary">第 1/${Math.max(1,Math.ceil(total/10))} 页</span></div></div>`;
}
function queryBar(fields){
  return `<div class="query-bar"><div class="row">${fields}<div class="row" style="gap:8px"><button class="btn btn-primary btn-sm">查询</button><button class="btn btn-sm">重置</button></div></div></div>`;
}
function selectField(label,opts){
  return `<div class="form-group"><span class="form-label">${label}</span><select>${opts.map(o=>`<option>${o}</option>`).join('')}</select></div>`;
}
function inputField(label,ph){
  return `<div class="form-group"><span class="form-label">${label}</span><input type="text" placeholder="${ph}" style="width:160px"></div>`;
}
function openModal(title,body,footer){
  $('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalFooter').innerHTML=footer||'';$('#modal').classList.add('show');
}
function closeModal(){$('#modal').classList.remove('show')}

/* ═══ 提交审批弹窗 ═══ */
function openApproval(source){
  approvalContext={source:source,selectedL1:[],selectedL2:[],selectedL3:[],reason:'',files:[]};
  renderApprovalBody();
  $('#approvalModal').classList.add('show');
}
function closeApproval(){$('#approvalModal').classList.remove('show')}
function renderApprovalBody(){
  const ctx=approvalContext;
  const l1Chips=ctx.selectedL1.map((n,i)=>`<span class="approver-chip">${n}<span class="chip-remove" onclick="removeApprover('L1',${i})">&times;</span></span>`).join('');
  const l2Chips=ctx.selectedL2.map((n,i)=>`<span class="approver-chip">${n}<span class="chip-remove" onclick="removeApprover('L2',${i})">&times;</span>`).join('');
  const l3Chips=ctx.selectedL3.map((n,i)=>`<span class="approver-chip">${n}<span class="chip-remove" onclick="removeApprover('L3',${i})">&times;</span>`).join('');
  const fileList=ctx.files.map((f,i)=>`<div class="file-item"><span>📄 ${f.name}</span><span class="text-xs text-secondary">${(f.size/1024/1024).toFixed(2)}MB</span><span class="file-remove" onclick="removeFile(${i})">&times; 移除</span></div>`).join('');
  $('#approvalBody').innerHTML=`
    <div class="approval-section">
      <div class="approval-section-title">📝 申请理由 <span class="text-danger">*</span></div>
      <textarea id="approvalReason" rows="3" style="width:100%" placeholder="请输入申请理由，说明提交审批的原因..."  oninput="approvalContext.reason=this.value">${ctx.reason}</textarea>
    </div>
    <div class="approval-section">
      <div class="approval-section-title">👤 选择审批人</div>
      <div class="approver-level">
        <div class="approver-level-label"><span class="text-danger">*</span> 一级审批人（必选，可多选，串行审批）</div>
        <div class="row" style="gap:8px">
          <select id="l1Select" style="min-width:160px">
            <option value="">请选择审批人</option>
            ${SCM_USERS.filter(u=>!ctx.selectedL1.includes(u)).map(u=>`<option value="${u}">${u}</option>`).join('')}
          </select>
          <button class="btn btn-sm btn-primary" onclick="addApprover('L1')">添加</button>
        </div>
        <div class="approver-chips">${l1Chips||'<span class="text-sm text-tertiary">暂未选择一级审批人</span>'}</div>
      </div>
      <div class="approver-level">
        <div class="approver-level-label">二级审批人（可选，可多选）</div>
        <div class="row" style="gap:8px">
          <select id="l2Select" style="min-width:160px">
            <option value="">请选择审批人</option>
            ${SCM_USERS.filter(u=>!ctx.selectedL2.includes(u)).map(u=>`<option value="${u}">${u}</option>`).join('')}
          </select>
          <button class="btn btn-sm" onclick="addApprover('L2')">添加</button>
        </div>
        <div class="approver-chips">${l2Chips||'<span class="text-sm text-tertiary">暂未选择二级审批人</span>'}</div>
      </div>
      <div class="approver-level">
        <div class="approver-level-label">三级审批人（可选，可多选）</div>
        <div class="row" style="gap:8px">
          <select id="l3Select" style="min-width:160px">
            <option value="">请选择审批人</option>
            ${SCM_USERS.filter(u=>!ctx.selectedL3.includes(u)).map(u=>`<option value="${u}">${u}</option>`).join('')}
          </select>
          <button class="btn btn-sm" onclick="addApprover('L3')">添加</button>
        </div>
        <div class="approver-chips">${l3Chips||'<span class="text-sm text-tertiary">暂未选择三级审批人</span>'}</div>
      </div>
    </div>
    <div class="approval-section">
      <div class="approval-section-title">📎 添加附件</div>
      <div class="file-upload-area" onclick="document.getElementById('fileInput').click()">
        <div style="font-size:24px;margin-bottom:4px">📁</div>
        <div class="text-sm text-secondary">点击上传附件（支持图片、Excel、Word、PDF等格式，单文件不超过30MB，最多3个）</div>
      </div>
      <input type="file" id="fileInput" style="display:none" multiple accept="image/*,.xls,.xlsx,.doc,.docx,.pdf" onchange="handleFiles(this)">
      <div class="file-list">${fileList}</div>
      ${ctx.files.length>=3?'<div class="text-xs text-danger" style="margin-top:4px">已达到最大附件数量（3个）</div>':''}
    </div>
  `;
}
function addApprover(level){
  const selId={L1:'l1Select',L2:'l2Select',L3:'l3Select'}[level];
  const val=$(('#'+selId)).value;
  if(!val)return;
  const key={L1:'selectedL1',L2:'selectedL2',L3:'selectedL3'}[level];
  if(!approvalContext[key].includes(val))approvalContext[key].push(val);
  renderApprovalBody();
}
function removeApprover(level,idx){
  const key={L1:'selectedL1',L2:'selectedL2',L3:'selectedL3'}[level];
  approvalContext[key].splice(idx,1);
  renderApprovalBody();
}
function handleFiles(input){
  const files=Array.from(input.files);
  for(const f of files){
    if(approvalContext.files.length>=3){alert('最多上传3个附件');break;}
    if(f.size>30*1024*1024){alert(`文件"${f.name}"超过30MB限制`);continue;}
    approvalContext.files.push({name:f.name,size:f.size});
  }
  input.value='';
  renderApprovalBody();
}
function removeFile(idx){approvalContext.files.splice(idx,1);renderApprovalBody();}
function submitApproval(){
  if(!approvalContext.reason.trim()){alert('未填写申请理由！');return;}
  if(approvalContext.selectedL1.length===0){alert('未选择一级审批人！');return;}
  const approvalNo='AP-'+String(Math.floor(Math.random()*9000)+1000);

  if(tab==='region'){
    const ths=["大区编码","大区名称","机型","产品编码","产品名称",...M_LABELS,"事业部名称","事业部编码","操作"];
    return `<h2>销售预测3+9需求汇总</h2>${tabsHtml}${query}${legend}
    <div class="action-bar"><div class="row"><button class="btn">导出</button></div></div>
    <div class="table-wrap"><table style="min-width:2200px"><thead><tr>${ths.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${regionRows.map((r,i)=>`<tr><td>${r.regionCode}</td><td class="font-semibold">${r.regionName}</td><td>${r.model}</td><td>${r.productCode}</td><td>${r.productName}</td>${r.months.map(m=>`<td style="padding:0">${mCell(m)}</td>`).join('')}<td>${r.buName}</td><td>${r.buCode}</td><td><button class="btn-link" onclick="currentTab.summary='zone';renderPage()">查看详情 →</button></td></tr>`).join('')}</tbody></table></div>
    ${pagination(regionRows.length)}`;
  }
  /* ── 国区维度 ── */
  if(tab==='zone'){
    const ths=["国区编码","国区名称","机型","产品编码","产品名称",...M_LABELS,"大区编码","大区名称","事业部名称","事业部编码","操作"];
    return `<h2>销售预测3+9需求汇总</h2>${tabsHtml}${query}${legend}

    ${pagination(zoneRows.length)}`;
  }
  /* ── 国家维度 ── */
  if(tab==='country'){

    return `<h2>销售预测3+9需求汇总</h2>${tabsHtml}${query}${legend}
    <div class="action-bar"><div class="row"><button class="btn">导出</button></div></div>
    <div class="table-wrap"><table style="min-width:2800px"><thead><tr>${ths.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${countryRows.map((r,i)=>`<tr><td>${r.areaCode}</td><td>${r.areaName}</td><td>${r.countryCode}</td><td class="font-semibold">${r.countryName}</td><td>${r.model}</td><td>${r.productCode}</td><td>${r.productName}</td>${r.months.map(m=>`<td style="padding:0">${mCell(m)}</td>`).join('')}<td>${r.zoneCode}</td><td>${r.zoneName}</td><td>${r.regionCode}</td><td>${r.regionName}</td><td>${r.buName}</td><td>${r.buCode}</td><td><button class="btn-link" onclick="currentTab.summary='detail';renderPage()">查看详情 →</button></td></tr>`).join('')}</tbody></table></div>

  const dCols=["版本号","单据号","审批单据号","数据来源(需求预测类型)","需求类型","作战区域编码","作战区域名称","国家编码","国家名称(目的国)","机型","产品编码","产品名称","选配","配置说明","需求备注","生效需求数量(修改前)","生效需求数量(修改后)","预计入库日期","要求交货日期","单价","总金额","发运计收","订单型/储备型","港口(起运港)","港口(目的港)","运输方式","贸易术语","国区编码","国区名称","大区编码","大区名称","事业部名称","事业部编码","客户编码","客户名称","创建时间","创建人","审批通过时间","修改人","修改时间","审批状态","操作"];

  <div class="table-wrap"><table style="min-width:4200px"><thead><tr><th style="width:36px"><input type="checkbox"></th>${dCols.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${summaryDetailRows.map((r,i)=>{const ch=r.qtyBefore!==r.qtyAfter;const isHistorical=r.sourceType==='历史销售预测';return `<tr><td class="td-center"><input type="checkbox"></td><td>${r.version}</td><td class="font-semibold text-primary">${r.docNo}</td><td>${r.approvalNo}</td><td>${sourceTag(r.sourceType)}</td><td><span class="tag tag-blue">${r.demandType}</span></td><td>${r.areaCode}</td><td>${r.areaName}</td><td>${r.countryCode}</td><td>${r.countryName}</td><td>${r.model}</td><td>${r.productCode}</td><td>${r.productName}</td><td>${r.optional}</td><td>${r.configDesc}</td><td title="${r.demandNote}" style="max-width:120px;overflow:hidden;text-overflow:ellipsis">${r.demandNote}</td><td class="td-right" style="color:${ch?'#8c8c':'#262626'};${ch?'text-decoration:line-through':''}">${r.qtyBefore}</td><td class="td-right" style="color:${ch?'#1890ff':'#262626'};font-weight:${ch?600:400}">${r.qtyAfter}</td><td>${r.expectedDate}</td><td>${r.deliveryDate}</td><td class="td-right">${r.unitPrice.toLocaleString()}</td><td class="td-right">${r.totalAmt.toLocaleString()}</td><td>${r.shipMethod}</td><td>${r.orderType}</td><td>${r.originPort}</td><td>${r.destPort}</td><td>${r.transportMode}</td><td>${r.tradeTerms}</td><td>${r.zoneCode}</td><td>${r.zoneName}</td><td>${r.regionCode}</td><td>${r.regionName}</td><td>${r.buName}</td><td>${r.buCode}</td><td>${r.customerCode}</td><td>${r.customerName}</td><td class="text-xs">${r.createTime}</td><td>${r.creator}</td><td class="text-xs">${r.approvalTime}</td><td>${r.modifier}</td><td class="text-xs">${r.modifyTime}</td><td>${statusPill(r.approvalStatus)}</td><td><div class="row" style="gap:6px"><button class="btn-link" onclick="openModal('查看详情','<div style=padding:12px>单据号：${r.docNo}<br/>数据来源：${r.sourceType}<br/>产品编码：${r.productCode}<br/>产品名称：${r.productName}<br/>生效需求数量(修改前)：${r.qtyBefore}<br/>生效需求数量(修改后)：${r.qtyAfter}<br/>预计入库日期：${r.expectedDate}<br/>备注：${r.demandNote}</div>','<button class=btn onclick=closeModal()>关闭</button>')">查看</button>${isHistorical?`<button class="btn-link" onclick="openModal('修改历史销售预测','<div style=display:flex;flex-direction:column;gap:12px><div style=display:grid;grid-template-columns:1fr\ 1fr;gap:12px><div class=form-group><label class=form-label>产品编码</label><input type=text value=\'${r.productCode}\' disabled></div><div class=form-group><label class=form-label>产品名称</label><input type=text value=\'${r.productName}\' disabled></div><div class=form-group><label class=form-label><span class=req>*</span>生效需求数量</label><input type=number placeholder=\'请输入\' value=${r.qtyAfter}></div><div class=form-group><label class=form-label><span class=req>*</span>预计入库日期</label><input type=text placeholder=\'选择日期\' value=\'${r.expectedDate}\'></div></div></div>','<button class=btn onclick=closeModal()>取消</button><button class=\'btn btn-primary\' onclick=\"alert(\'修改成功\');closeModal()\">保存修改</button>')">修改</button>`:''}</div></td></tr>`}).join('')}</tbody></table></div>
  ${pagination(summaryDetailRows.length)}`;
}

renderPage();
